<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>做T 研究台</title>
<style>
:root{
  --bg:#0a0c10; --bg2:#0e1116; --surf:#13161c; --surf2:#191d25; --surf3:#1f242e;
  --line:#222733; --line2:#2d3340; --line3:#3a4252;
  --tx:#e8ebf2; --tx2:#96a0b2; --tx3:#5f6878; --tx4:#454c5a;
  --up:#ff4d5e; --dn:#16c784; --warn:#f5a524; --acc:#5b8cff; --acc2:#8b5cf6;
  --r:14px; --r2:10px; --r3:7px;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -12px rgba(0,0,0,.6);
  --nav:232px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--tx);
  font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}
a{color:var(--acc);text-decoration:none}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
aside{
  width:var(--nav);flex-shrink:0;border-right:1px solid var(--line);
  background:var(--bg2);position:fixed;top:0;bottom:0;left:0;z-index:40;
  display:flex;flex-direction:column;
}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand h1{font-size:15.5px;margin:0;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand h1 i{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,#5b8cff,#8b5cf6);font-style:normal;
  font-size:12px;color:#fff;font-weight:700}
.brand p{margin:5px 0 0 30px;font-size:11px;color:var(--tx3)}
.navlist{flex:1;padding:12px 10px;overflow-y:auto}
.navlist button{
  width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;
  color:var(--tx2);padding:9px 11px;border-radius:var(--r3);font-size:13.5px;
  cursor:pointer;font-family:inherit;text-align:left;transition:.15s;margin-bottom:2px;
}
.navlist button:hover{background:var(--surf);color:var(--tx)}
.navlist button.on{background:rgba(91,140,255,.13);color:var(--acc);font-weight:600}
.navlist button b{font-size:15px;font-weight:400;width:18px;text-align:center}
.navlist .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--up);display:none}
.navlist .dot.on{display:block}
.navfoot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--tx4)}
main{margin-left:var(--nav);flex:1;min-width:0;padding:0 0 60px}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(10,12,16,.86);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;gap:12px;
}
.topbar h2{font-size:16px;margin:0;font-weight:650}
.topbar .sp{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:22px 26px 0}

@media(max-width:860px){
  aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;
    flex-direction:row;border-right:0;border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .brand,.navfoot{display:none}
  .navlist{display:flex;padding:0;overflow:visible}
  .navlist button{flex-direction:column;gap:3px;padding:8px 0 9px;font-size:10.5px;
    border-radius:0;margin:0;justify-content:center}
  .navlist button b{font-size:17px;width:auto}
  .navlist button.on{background:none}
  .navlist button.on::before{content:"";position:absolute;top:0;left:50%;
    transform:translateX(-50%);width:24px;height:2px;background:var(--acc);border-radius:0 0 3px 3px}
  .navlist button{position:relative}
  .navlist .dot{position:absolute;top:6px;right:calc(50% - 15px);margin:0}
  main{margin-left:0;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .topbar{padding:11px 16px}
  .wrap{padding:16px 16px 0}
}

/* ============ 组件 ============ */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:11.5px;margin:0 0 14px;font-weight:650;color:var(--tx2);
  letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-size:11px;color:var(--tx3);text-transform:none;
  letter-spacing:0;font-weight:400}
.sub{font-size:12px;color:var(--tx3);line-height:1.75}
.sub b{color:var(--tx2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kpi{background:var(--surf2);border:1px solid var(--line);border-radius:var(--r2);
  padding:12px 13px;transition:.15s}
.kpi:hover{border-color:var(--line2)}
.kpi .k{font-size:10.5px;color:var(--tx3);display:flex;align-items:center;gap:4px}
.kpi .v{font-size:21px;font-weight:650;margin-top:5px;letter-spacing:-.02em;line-height:1.1}
.kpi .s{font-size:10.5px;color:var(--tx4);margin-top:3px}

.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--tx2)}
.wr{color:var(--warn)}.ac{color:var(--acc)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 9px;
  border-radius:99px;font-weight:600;white-space:nowrap}
.pill.good{background:rgba(22,199,132,.15);color:var(--dn)}
.pill.bad{background:rgba(255,77,94,.15);color:var(--up)}
.pill.warn{background:rgba(245,165,36,.15);color:var(--warn)}
.pill.info{background:rgba(91,140,255,.15);color:var(--acc)}
.pill.dim{background:var(--surf3);color:var(--tx3)}

.btn{background:linear-gradient(180deg,#6b97ff,#4c7ef5);color:#fff;border:0;border-radius:var(--r3);
  padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:.15s;box-shadow:0 2px 10px -3px rgba(76,126,245,.6)}
.btn:hover{filter:brightness(1.09)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.g{background:var(--surf2);color:var(--tx2);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn.g:hover{background:var(--surf3);color:var(--tx)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{background:rgba(255,77,94,.12);color:var(--up);border:1px solid rgba(255,77,94,.3);box-shadow:none}

.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r3);padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--tx2);padding:6px 13px;border-radius:5px;
  font-size:12.5px;cursor:pointer;font-family:inherit;transition:.14s;white-space:nowrap}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}

label{display:block;font-size:11.5px;color:var(--tx2);margin-bottom:6px;font-weight:500}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);
  color:var(--tx);border-radius:var(--r3);padding:9px 11px;font-size:14px;
  font-family:inherit;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.12)}
.row{display:flex;gap:12px;margin-bottom:13px}
.row>div{flex:1;min-width:0}

table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{color:var(--tx3);font-weight:500;text-align:left;padding:9px 8px;
  border-bottom:1px solid var(--line2);font-size:10.5px;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.04em}
tbody td{padding:9px 8px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer;transition:.12s}
tbody tr.clk:hover{background:var(--surf2)}
td.r,th.r{text-align:right}
.tw{overflow-x:auto;margin:0 -8px}

.box{border-radius:var(--r2);padding:13px 15px;font-size:12.5px;line-height:1.75;margin-top:13px}
.box b{display:block;margin-bottom:4px;font-size:13px}
.box em{font-style:normal;font-weight:700;color:#fff}
.box.warn{background:rgba(245,165,36,.09);border:1px solid rgba(245,165,36,.24);color:#ffd79a}
.box.bad{background:rgba(255,77,94,.09);border:1px solid rgba(255,77,94,.24);color:#ffb0b9}
.box.good{background:rgba(22,199,132,.09);border:1px solid rgba(22,199,132,.24);color:#8eecc3}
.box.info{background:rgba(91,140,255,.08);border:1px solid rgba(91,140,255,.22);color:#c2d3ff}
.box.dim{background:var(--surf2);border:1px solid var(--line);color:var(--tx2)}

.empty{text-align:center;color:var(--tx3);padding:56px 24px;line-height:1.85}
.empty b{display:block;color:var(--tx2);font-size:15.5px;margin-bottom:7px}
.skel{background:linear-gradient(90deg,var(--surf2) 25%,var(--surf3) 37%,var(--surf2) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--r3)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* 手机第一屏：数据新鲜度 + 下次动手时刻 */
.hero{background:linear-gradient(135deg,rgba(91,140,255,.10),rgba(139,92,246,.07));
  border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.hrow{display:flex;align-items:center;gap:12px;padding:3px 0}
.hrow .hk{font-size:11.5px;color:var(--tx3);width:62px;flex-shrink:0}
.hrow .hv{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.hero .hnote{font-size:11.5px;color:var(--tx3);margin-top:7px;padding-top:8px;
  border-top:1px solid var(--line);line-height:1.7}

/* ============ 标的卡 ============ */
.ilist{display:grid;gap:13px}
.icard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.icard:hover{border-color:var(--line3);transform:translateY(-1px);box-shadow:var(--sh)}
.icard.sell::before,.icard.buy::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.icard.sell::before{background:var(--up)}
.icard.buy::before{background:var(--dn)}
.ihead{display:flex;align-items:flex-start;gap:14px}
.iname{font-size:16px;font-weight:650;letter-spacing:-.01em}
.icode{font-size:11px;color:var(--tx3);margin-top:3px}
.ipx{font-size:22px;font-weight:700;text-align:right;line-height:1.1;letter-spacing:-.02em}
.ichg{font-size:12px;font-weight:600;text-align:right;margin-top:2px}
.istat{display:flex;gap:16px;margin-top:13px;flex-wrap:wrap}
.istat>div{font-size:11.5px;color:var(--tx3)}
.istat>div b{display:block;color:var(--tx);font-size:14px;font-weight:600;margin-top:2px}

/* ============ 图表 ============ */
.chart{position:relative;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r2);padding:12px 14px 10px;margin-bottom:14px}
.chart .ch{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.chart .ch b{font-size:12px;color:var(--tx2);font-weight:600}
.chart .ch span{font-size:10.5px;color:var(--tx4);margin-left:auto}
.chart svg{display:block;overflow:visible}
/* SVG 用 preserveAspectRatio=none 做横向拉伸，里面的 <text> 会被压扁，
   所以所有刻度文字改成绝对定位的 HTML 覆盖层，任何宽度下都清晰 */
.chart .cw{position:relative}
.chart .axl{position:absolute;font-size:10px;line-height:1;color:var(--tx4);
  pointer-events:none;white-space:nowrap;letter-spacing:.02em;
  background:var(--bg2);padding:1px 3px;border-radius:3px}
.chart .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--tx3);margin-top:8px}
.chart .lg i{display:inline-block;width:11px;height:2px;margin-right:5px;vertical-align:3px;border-radius:1px}
.chart .lg i.sq{height:9px;border-radius:2px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:rgba(25,29,37,.97);
  border:1px solid var(--line3);border-radius:8px;padding:9px 11px;font-size:11.5px;
  line-height:1.7;z-index:20;opacity:0;transition:opacity .1s;box-shadow:var(--sh);
  white-space:nowrap;backdrop-filter:blur(8px)}
.tip.on{opacity:1}
.tip .tt{color:var(--tx3);font-size:10.5px;margin-bottom:4px}
.tip .tr{display:flex;justify-content:space-between;gap:16px}
.tip .tr span{color:var(--tx3)}
.tip .tr b{font-weight:600}

/* 分位条 */
.gauge{margin:14px 0}
.gauge .tk{position:relative;height:36px;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r3);overflow:hidden}
.gauge .fl{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(22,199,132,.28) 0%,rgba(95,104,120,.06) 50%,rgba(255,77,94,.28) 100%)}
.gauge .gt{position:absolute;top:0;bottom:0;width:1px;background:var(--tx4)}
.gauge .gt b{position:absolute;top:3px;font-size:9.5px;color:var(--tx3);white-space:nowrap;font-weight:500}
.gauge .pin{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px;background:var(--acc);
  box-shadow:0 0 10px rgba(91,140,255,.9)}
.gauge .cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx3);margin-top:6px}

/* 因子条 */
.fr{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12px}
.fr .fn{width:82px;color:var(--tx2);flex-shrink:0}
.fr .fb{flex:1;height:16px;background:var(--bg2);border-radius:4px;position:relative;
  border:1px solid var(--line);overflow:hidden}
.fr .fb i{position:absolute;top:0;bottom:0}
.fr .fb .md{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.fr .fv{width:46px;text-align:right;color:var(--tx2);flex-shrink:0;font-size:11.5px}

/* 详情页 */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--tx2);
  font-size:13px;cursor:pointer;font-family:inherit;padding:0;margin-bottom:4px}
.back:hover{color:var(--tx)}
.dhead{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.dhead .dn{font-size:24px;font-weight:700;letter-spacing:-.02em}
.dhead .dc{font-size:12px;color:var(--tx3);margin-top:4px}
.dhead .dp{margin-left:auto;text-align:right}
.dhead .dp .v{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1}
.dhead .dp .c{font-size:13.5px;font-weight:600;margin-top:3px}
@media(max-width:860px){.dhead .dp{margin-left:0;text-align:left}.dhead .dp .v{font-size:24px}}

/* 行动条 */
.action{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r2);
  padding:15px 17px;margin-bottom:16px;border:1px solid var(--line);background:var(--surf2)}
.action.sell{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.26)}
.action.buy{background:rgba(22,199,132,.08);border-color:rgba(22,199,132,.26)}
.action.block{background:rgba(245,165,36,.07);border-color:rgba(245,165,36,.22)}
.action .ai{font-size:26px;line-height:1;flex-shrink:0;margin-top:2px}
.action .ah{font-size:16px;font-weight:650;margin-bottom:4px}
.action .ab{font-size:12.5px;color:var(--tx2);line-height:1.7}
.action .ab em{color:var(--tx);font-style:normal;font-weight:650}

#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);
  z-index:200;background:var(--surf3);border:1px solid var(--line3);color:var(--tx);
  padding:11px 18px;border-radius:var(--r2);font-size:13.5px;box-shadow:var(--sh);
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:860px){#toast{bottom:calc(84px + env(safe-area-inset-bottom))}}

.fade{animation:fd .22s ease}
@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.page{display:none}.page.on{display:block}
.m{color:var(--tx3)}
/* 光迅作战台 */
#p-gx details.dkr{border-bottom:1px solid var(--line)}
#p-gx details.dkr:last-of-type{border-bottom:0}
#p-gx details.dkr>summary{display:grid;grid-template-columns:minmax(84px,1.1fr) minmax(0,1.6fr) auto auto;
  align-items:center;gap:8px;padding:10px 0;font-size:12.5px;color:var(--tx);font-weight:400}
#p-gx details.dkr>summary::before{display:none;content:none}
.dkn{color:var(--tx2)}
.dkv{font-weight:600;min-width:0;overflow-wrap:anywhere}
.dkc,.dkt{justify-self:end}
.dkd{font-size:12px;color:var(--tx3);line-height:1.75;padding:0 0 12px}
.dkd b{color:var(--tx2)}
@media(max-width:560px){
  #p-gx details.dkr>summary{grid-template-columns:1fr auto;row-gap:5px}
  .dkv{grid-column:1/2;grid-row:2}
  .dkc{grid-column:2/3;grid-row:1}
  .dkt{grid-column:2/3;grid-row:2}
}
.dkbar{display:inline-block;position:relative;width:120px;height:8px;border-radius:4px;vertical-align:middle;
  background:linear-gradient(90deg,rgba(22,199,132,.55),rgba(95,104,120,.25) 50%,rgba(255,77,94,.55))}
.dkbar i{position:absolute;top:-3px;width:3px;height:14px;margin-left:-1px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.7)}
.lvbox{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.lvbox>div{background:var(--surf2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 12px 10px;text-align:center;min-width:0}
.lvbox span{display:block;font-size:11px;color:var(--tx3)}
.lvbox b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.lvbox i{display:block;font-style:normal;font-size:11px;color:var(--tx3);overflow-wrap:anywhere}
.lvbox em{display:block;font-style:normal;font-size:11px;margin-top:5px;color:var(--warn)}
.lvbox em.m{color:var(--tx3)}
table.lvlad td{padding:6px 8px;font-size:12px}
.lvseg{display:flex;width:100%}
.lvseg button{flex:1;padding:7px 4px;font-size:12px}
table.lvlad tr.lvpick td{background:rgba(91,140,255,.10);font-weight:600}
table.lvlad tr.lvanc td{background:var(--surf2);color:var(--tx2)}
.lvbox .lva b{font-size:16px;color:var(--tx2)}
.lvbox .lva{max-width:110px}
@media(max-width:420px){.lvbox b{font-size:20px}.lvbox .lva{max-width:86px}}
.dkn2{font-size:12.5px;line-height:1.6;padding:5px 0;border-bottom:1px solid var(--line)}
.dkn2 a{color:var(--tx);text-decoration:none}
.dkn2 a:hover{color:var(--acc)}
.dkopen{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.dkopen span{flex:1 1 180px}
.dkopen input{width:110px;flex:0 0 110px;padding:6px 8px;font-size:13px}
details.fold>summary{cursor:pointer;font-size:12.5px;color:var(--tx2);padding:8px 0;
  list-style:none;display:flex;align-items:center;gap:7px;font-weight:500}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--tx3);transition:.18s;display:inline-block}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary:hover{color:var(--tx)}
</style>
</head>
<body>
<div class="app">

<aside>
  <div class="brand">
    <h1><i>T</i>做T 研究台</h1>
    <p>v4 · 光迅作战台 · ETF 规则</p>
  </div>
  <div class="navlist" id="nav">

<script>
/* ============================================================
   隔日T引擎 v3 —— 针对「股票+ETF混合持仓」重建
   与之前股票版的差异：
   1. 成本按品种分：ETF 免印花税免过户费，最小变动价位 0.001；股票反之
   2. 标准化窗口自适应：新上市标的历史短，用可得的最长窗口（下限40天）
   3. 因子权重不照搬股票版，在 ETF 池上重新验证后再定
   无未来函数：因子只用截至当日收盘；标准化与百分位窗口只含当日之前。
   ============================================================ */
var SW = (function () {
  "use strict";

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function sq(x, s) { if (!isFinite(x) || !s) return 0; return clamp(100 * Math.tanh(x / s), -100, 100); }
  function mean(a) { var s = 0, n = 0, i; for (i = 0; i < a.length; i++) if (isFinite(a[i])) { s += a[i]; n++; } return n ? s / n : 0; }
  function stdev(a) { var b = a.filter(isFinite); if (b.length < 2) return 0; var m = mean(b), s = 0, i; for (i = 0; i < b.length; i++) s += (b[i] - m) * (b[i] - m); return Math.sqrt(s / (b.length - 1)); }
  function median(a) { var b = a.filter(isFinite).slice().sort(function (x, y) { return x - y; }); if (!b.length) return 0; var h = b.length >> 1; return b.length % 2 ? b[h] : (b[h - 1] + b[h]) / 2; }
  function pctRank(arr, v) { var n = arr.length; if (!n) return 50; var c = 0, i; for (i = 0; i < n; i++) if (arr[i] <= v) c++; return c / n * 100; }
  function wilson(k, n) {
    if (!n) return [0, 0];
    var z = 1.96, p = k / n, d = 1 + z * z / n, c = p + z * z / (2 * n);
    var m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
    return [clamp((c - m) / d * 100, 0, 100), clamp((c + m) / d * 100, 0, 100)];
  }
  function tOf(a) { var b = a.filter(isFinite); if (b.length < 3) return 0; var s = stdev(b); return s > 0 ? mean(b) / (s / Math.sqrt(b.length)) : 0; }
  function rankify(a) {
    var ix = a.map(function (v, i) { return [v, i]; });
    ix.sort(function (x, y) { return x[0] - y[0]; });
    var r = new Array(a.length), i = 0;
    while (i < ix.length) {
      var j = i; while (j + 1 < ix.length && ix[j + 1][0] === ix[i][0]) j++;
      var av = (i + j) / 2 + 1;
      for (var k = i; k <= j; k++) r[ix[k][1]] = av;
      i = j + 1;
    }
    return r;
  }
  function pearson(xs, ys) {
    var n = xs.length; if (n < 8) return NaN;
    var mx = mean(xs), my = mean(ys), sx = 0, sy = 0, sxy = 0, i;
    for (i = 0; i < n; i++) { var a = xs[i] - mx, b = ys[i] - my; sx += a * a; sy += b * b; sxy += a * b; }
    return (sx > 0 && sy > 0) ? sxy / Math.sqrt(sx * sy) : NaN;
  }
  function spearman(x, y) { return pearson(rankify(x), rankify(y)); }

  function parseK(arr) {
    return arr.map(function (s) {
      var a = s.split(",");
      return { d: a[0], o: +a[1], c: +a[2], h: +a[3], l: +a[4], vol: +a[5], amt: +a[6],
        amp: +a[7], pct: +a[8], chg: +a[9], turn: +a[10] };
    });
  }

  /* ---------------- 成本 ---------------- */
  function tickOf(kind) { return kind === "etf" ? 0.001 : 0.01; }
  function costOf(px, kind, F) {
    var notional = F.notional > 0 ? F.notional : 50000;
    var comm = Math.max(notional * (F.commRate || 0) / 1e4, F.commMin || 0);
    var commBp = comm / notional * 1e4 * 2;
    var stampBp = kind === "etf" ? 0 : (F.stamp == null ? 0.05 : F.stamp) * 100;
    var transBp = kind === "etf" ? 0 : (F.trans == null ? 0.001 : F.trans) * 100 * 2;
    var tickBp = px > 0 ? tickOf(kind) / px * 1e4 : 0;
    var slipBp = tickBp * (F.slipTicks == null ? 1 : F.slipTicks);
    return { commBp: commBp, stampBp: stampBp, transBp: transBp, tickBp: tickBp,
      slipBp: slipBp, total: commBp + stampBp + transBp + slipBp };
  }

  /* ---------------- 因子 ---------------- */
  var FACTORS = [
    { k: "day1", label: "当日涨跌", desc: "今日涨跌幅÷ATR" },
    { k: "rs", label: "相对基准", desc: "今日涨跌 − 基准指数涨跌，÷ATR" },
    { k: "run", label: "连涨连跌", desc: "连续同向天数" },
    { k: "lv", label: "量比", desc: "今日量÷近20日中位量，取对数" },
    { k: "bias5", label: "5日乖离", desc: "距5日均线距离÷ATR" },
    { k: "amp", label: "振幅", desc: "今日振幅÷ATR" },
    { k: "gap", label: "跳空", desc: "开盘跳空÷ATR" },
    { k: "pos20", label: "20日位置", desc: "在近20日区间中的位置" },
    { k: "vol5", label: "5日波动", desc: "近5日收益标准差÷ATR" },
    { k: "accel", label: "动量加速度", desc: "近2日涨幅 − 前3日涨幅" },
    { k: "vTrend", label: "量能趋势", desc: "近3日均量÷近10日均量" },
    { k: "revsp", label: "回补速度", desc: "今日把昨日波动回补了多少" }
  ];

  function factorsAt(daily, i, benchPct) {
    if (i < 25) return null;
    /* 收盘价数组缓存在 daily 上（以前每根K都重建一遍，整条序列是 O(n²)，手机上很卡）。daily 一旦生成就不再修改。 */
    var c = (daily._c && daily._c.length === daily.length) ? daily._c : (daily._c = daily.map(function (x) { return x.c; }));
    var px = c[i];
    var trs = [], j;
    for (j = i - 13; j <= i; j++) {
      trs.push(Math.max(daily[j].h - daily[j].l,
        Math.abs(daily[j].h - c[j - 1]), Math.abs(daily[j].l - c[j - 1])));
    }
    var atr = mean(trs) / px * 100;
    if (!(atr > 0)) return null;
    var ma5 = mean(c.slice(i - 4, i + 1));
    var vols = daily.slice(i - 19, i + 1).map(function (x) { return x.vol; });
    var medV = median(vols);
    var hi20 = Math.max.apply(null, daily.slice(i - 19, i + 1).map(function (x) { return x.h; }));
    var lo20 = Math.min.apply(null, daily.slice(i - 19, i + 1).map(function (x) { return x.l; }));
    var run = 0;
    for (j = i; j > 0 && j > i - 8; j--) {
      var up = c[j] > c[j - 1];
      if (j === i) run = up ? 1 : -1;
      else if ((up && run > 0) || (!up && run < 0)) run += up ? 1 : -1;
      else break;
    }
    var r5 = [];
    for (j = i - 4; j <= i; j++) r5.push((c[j] / c[j - 1] - 1) * 100);
    var bp = benchPct ? (benchPct[daily[i].d] || 0) : 0;
    var v3 = mean(daily.slice(i - 2, i + 1).map(function (x) { return x.vol; }));
    var v10 = mean(daily.slice(i - 9, i + 1).map(function (x) { return x.vol; }));
    var prevRange = (daily[i - 1].h - daily[i - 1].l) / c[i - 1] * 100;

    return {
      day1: daily[i].pct / atr,
      rs: (daily[i].pct - bp) / atr,
      run: run,
      lv: medV > 0 ? Math.log(daily[i].vol / medV) : 0,
      bias5: (px / ma5 - 1) * 100 / atr,
      amp: ((daily[i].h - daily[i].l) / px * 100) / atr,
      gap: (daily[i].o / c[i - 1] - 1) * 100 / atr,
      pos20: hi20 > lo20 ? (px - lo20) / (hi20 - lo20) : 0.5,
      vol5: stdev(r5) / atr,
      accel: ((c[i] / c[i - 2] - 1) - (c[i - 2] / c[i - 5] - 1)) * 100 / atr,
      vTrend: v10 > 0 ? Math.log(v3 / v10) : 0,
      revsp: prevRange > 0 ? (daily[i].pct / prevRange) : 0,
      _atr: atr, _px: px
    };
  }

  /* ---------------- 序列：滚动标准化 + 合成 + 滚动百分位 ---------------- */
  function buildSeries(daily, benchPct, P) {
    var raw = [], i;
    for (i = 0; i < daily.length; i++) {
      var f = factorsAt(daily, i, benchPct);
      raw.push(f ? { i: i, d: daily[i].d, f: f } : null);
    }
    var keys = FACTORS.filter(function (x) { return Math.abs(P.w[x.k] || 0) > 0; }).map(function (x) { return x.k; });
    /* 没有任何因子有权重时，合成分恒为0，百分位会退化成「每天都触发」。
       这是个会把行情涨跌伪装成信号的陷阱，直接拒绝出信号。 */
    if (!keys.length) return raw.map(function () { return null; });
    var out = [], hist = [], scores = [];
    for (i = 0; i < raw.length; i++) {
      if (!raw[i]) { out.push(null); continue; }
      hist.push(raw[i]);
      var minW = P.minWin || 40;
      if (hist.length <= minW) { out.push(null); continue; }
      var win = hist.slice(Math.max(0, hist.length - 1 - P.normWin), hist.length - 1);
      var s = 0, wsum = 0, zs = {};
      keys.forEach(function (k) {
        var col = win.map(function (r) { return r.f[k]; });
        var m = mean(col), sd = stdev(col) || 1;
        var z = clamp((raw[i].f[k] - m) / sd, -4, 4);
        zs[k] = z;
        var w = P.w[k] || 0;
        s += w * z; wsum += Math.abs(w);
      });
      var score = wsum > 0 ? s / wsum : 0;
      var pw = scores.filter(function (v) { return v != null; });
      pw = pw.slice(Math.max(0, pw.length - P.pctWin));
      /* 窗口里分数全相同（退化）时不给百分位，否则会把常数误判成极端值 */
      var pct = (pw.length >= 30 && stdev(pw) > 1e-9) ? pctRank(pw, score) : 50;
      out.push({ i: raw[i].i, d: raw[i].d, f: raw[i].f, z: zs, score: score, pct: pct });
      scores.push(score);
    }
    return out;
  }

  /* ---------------- 市场状态门控 ----------------
     只用大盘指数算：当日涨跌(ATR归一) + 成交额放缩。
     规则：大盘上涨日只允许倒T(高抛)，大盘下跌日只允许正T(低吸)。
     实证：不门控 +20.4bp(t=1.89) → 加门控 +36.9bp(t=3.28)，5个切分点全部改善；
           其中「正T在大盘上涨日做」是显著亏钱的 -123.7bp(t=-3.1)。 */
  function marketState(benchDaily) {
    var out = {};
    if (!benchDaily || benchDaily.length < 30) return out;
    var c = benchDaily.map(function (x) { return x.c; });
    for (var i = 25; i < benchDaily.length; i++) {
      var trs = [], j;
      for (j = i - 13; j <= i; j++) {
        trs.push(Math.max(benchDaily[j].h - benchDaily[j].l,
          Math.abs(benchDaily[j].h - c[j - 1]), Math.abs(benchDaily[j].l - c[j - 1])));
      }
      var atr = mean(trs) / c[i] * 100;
      if (!(atr > 0)) continue;
      var amt20 = median(benchDaily.slice(i - 19, i + 1).map(function (x) { return x.amt; }));
      var ret = benchDaily[i].pct / atr;
      var amt = amt20 > 0 ? Math.log(benchDaily[i].amt / amt20) : 0;
      out[benchDaily[i].d] = {
        ret: ret, amt: amt,
        panic: -ret * 0.6 + amt * 0.4,
        calm: ret > 0            /* 大盘上涨=平静，允许倒T */
      };
    }
    return out;
  }
  /* 这一天允许哪个方向：+1 只倒T / -1 只正T / 0 数据缺失时不限制 */
  function allowedDir(mkt, d) {
    var m = mkt && mkt[d];
    if (!m) return 0;
    return m.calm ? 1 : -1;
  }

  /* ---------------- 回测 ---------------- */
  function backtest(series, daily, P, F, kind, opt) {
    opt = opt || {};
    var trades = [], lastExit = -999, i;
    var MK = opt.mkt || null;
    for (i = 0; i < series.length; i++) {
      var s = series[i];
      if (!s) continue;
      var di = s.i;
      if (di + P.holdDays > daily.length - 1) continue;   /* 出场那根K必须已经存在 */
      if (opt.from && daily[di].d < opt.from) continue;
      if (opt.to && daily[di].d > opt.to) continue;
      if (di - lastExit < P.cooldown) continue;
      var dir = 0;
      if (s.pct >= 100 - P.qSell) dir = 1;
      else if (s.pct <= P.qBuy) dir = -1;
      if (!dir) continue;
      if (P.dirMode && P.dirMode !== dir) continue;
      if (P.useGate && MK) {
        var ad = allowedDir(MK, daily[di].d);
        if (ad !== 0 && ad !== dir) continue;
      }

      /* 执行模式：同一个信号（收盘T出），三种成交方式
         full = 收盘T进、收盘T+1出（扛一夜 + 走一个日内段）
         gap  = 收盘T进、开盘T+1出（只扛一夜；跳空没法止损，所以不设止损）
         day  = 开盘T+1进、收盘T+1出（完全不隔夜；盘中连续，止损能成交） */
      var mode = P.mode || "full";
      var nd0 = daily[di + 1];
      if (mode !== "full" && !nd0) continue;
      var entry = (mode === "day") ? nd0.o : daily[di].c;
      if (!(entry > 0)) continue;
      var cost = costOf(entry, kind, F).total;
      if (P.minRatio > 0) {
        var rr = [], z;
        for (z = Math.max(1, di - 39); z <= di; z++) rr.push((daily[z].h - daily[z].l) / daily[z].c * 1e4);
        if (median(rr) / cost < P.minRatio) continue;
      }
      var atrBp = s.f._atr * 100;
      var stopBp = P.stopMul > 0 ? P.stopMul * atrBp : 0;
      var got = null, why = "", days = 0, k;
      if (mode === "gap") {
        got = dir > 0 ? (entry / nd0.o - 1) * 1e4 : (nd0.o / entry - 1) * 1e4;
        why = "次日开盘"; days = 1;
      } else if (mode === "day") {
        /* 开盘就涨停（买）/ 跌停（卖）：进场单成交不了，这笔不存在 */
        var og = (nd0.o / daily[di].c - 1) * 100;
        if ((dir < 0 && og >= 9.7) || (dir > 0 && og <= -9.7)) { got = null; }
        else {
          var adv1 = dir > 0 ? (nd0.h / entry - 1) * 1e4 : (entry / nd0.l - 1) * 1e4;
          var ret1 = dir > 0 ? (entry / nd0.c - 1) * 1e4 : (nd0.c / entry - 1) * 1e4;
          if (stopBp > 0 && adv1 >= stopBp) { got = -stopBp; why = "止损"; }
          else { got = ret1; why = "当日收盘"; }
        }
        days = 1;
      } else {
        for (k = 1; k <= P.holdDays; k++) {
          var nd = daily[di + k];
          if (!nd) break;
          days = k;
          var adverse = dir > 0 ? (nd.h / entry - 1) * 1e4 : (entry / nd.l - 1) * 1e4;
          var ret = dir > 0 ? (entry / nd.c - 1) * 1e4 : (nd.c / entry - 1) * 1e4;
          /* 开盘就已经越过止损位：止损单只能按开盘价成交，亏得比止损价多。
             旧版一律按止损价算，是个乐观假设（个股 0.5ATR 紧止损受影响最大）。 */
          var gapAdv = dir > 0 ? (nd.o / entry - 1) * 1e4 : (entry / nd.o - 1) * 1e4;
          if (stopBp > 0 && gapAdv >= stopBp) { got = -gapAdv; why = "跳空止损"; break; }
          if (stopBp > 0 && adverse >= stopBp) { got = -stopBp; why = "止损"; break; }
          if (k === P.holdDays) { got = ret; why = "到期"; }
        }
      }
      if (got == null) continue;
      trades.push({
        d: daily[di].d, exitD: daily[di + days] ? daily[di + days].d : "",
        dir: dir, entry: entry, gross: got, cost: cost, net: got - cost,
        days: days, why: why, pct: s.pct, score: s.score, code: opt.code || ""
      });
      lastExit = di + days;
    }
    return trades;
  }

  function stats(trades) {
    var n = trades.length;
    var nets = trades.map(function (t) { return t.net; });
    var wins = nets.filter(function (v) { return v > 0; }).length;
    var m = mean(nets), sd = stdev(nets);
    var gw = 0, gl = 0, wn = 0, ln = 0, cum = 0, peak = 0, mdd = 0, curve = [0];
    var byDir = {}, byWhy = {};
    trades.forEach(function (t) {
      if (t.net > 0) { gw += t.net; wn++; } else { gl -= t.net; ln++; }
      cum += t.net; curve.push(cum);
      if (cum > peak) peak = cum;
      if (peak - cum > mdd) mdd = peak - cum;
      var add = function (o, k) { o[k] = o[k] || { n: 0, w: 0, net: 0 }; o[k].n++; if (t.net > 0) o[k].w++; o[k].net += t.net; };
      add(byDir, t.dir > 0 ? "倒T" : "正T"); add(byWhy, t.why);
    });
    var need = (m !== 0 && sd > 0) ? Math.ceil(Math.pow(2 * sd / Math.abs(m), 2)) : 99999;
    /* t 值按「交易日」聚类：同一天的多笔交易同涨同跌，不能当成独立样本。
       旧版逐笔算 t，在 ETF 池上把显著性夸大了一倍多（3.94 → 1.67）。 */
    var eg = {}, G = 0, ss = 0, tc = 0;
    trades.forEach(function (t) { eg[t.d] = (eg[t.d] || 0) + (t.net - m); });
    Object.keys(eg).forEach(function (k) { G++; ss += eg[k] * eg[k]; });
    if (G > 2 && ss > 0) tc = m / Math.sqrt((G / (G - 1)) * ss / (n * n));
    return {
      trades: trades, n: n, win: n ? wins / n * 100 : 0, winCI: wilson(wins, n),
      mean: m, sd: sd, t: tc, tNaive: tOf(nets), days: G, total: m * n, mdd: mdd, curve: curve,
      pf: gl > 0 ? gw / gl : (gw > 0 ? 99 : 0),
      payoff: (wn && ln && gl > 0) ? (gw / wn) / (gl / ln) : 0,
      avgCost: n ? mean(trades.map(function (x) { return x.cost; })) : 0,
      avgGross: n ? mean(trades.map(function (x) { return x.gross; })) : 0,
      byDir: byDir, byWhy: byWhy, needN: need
    };
  }

  function defaultP() {
    var w = {};
    FACTORS.forEach(function (f) { w[f.k] = 0; });
    w.day1 = 100; w.rs = 100; w.run = 80; w.lv = 80; w.bias5 = 60; w.amp = 50; w.gap = 50;
    return {
      w: w, normWin: 120, pctWin: 120, minWin: 40,
      qSell: 10, qBuy: 10, holdDays: 1, cooldown: 1,
      stopMul: 1.5, dirMode: 0, minRatio: 8, useGate: 1
    };
  }
  function defaultF() {
    return { notional: 50000, commRate: 1, commMin: 5, stamp: 0.05, trans: 0.001, slipTicks: 0.5 };
  }

  return {
    parseK: parseK, costOf: costOf, tickOf: tickOf, factorsAt: factorsAt,
    buildSeries: buildSeries, backtest: backtest, stats: stats,
    marketState: marketState, allowedDir: allowedDir,
    defaultP: defaultP, defaultF: defaultF, FACTORS: FACTORS,
    mean: mean, stdev: stdev, median: median, spearman: spearman, tOf: tOf,
    wilson: wilson, rankify: rankify, clamp: clamp, pctRank: pctRank
  };
})();

</script>

<script>
/* 交互式 SVG 图表 —— 无外部依赖，带十字光标与悬浮数据 */
var CH = (function () {
  "use strict";
  var uid = 0;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
  function fx(v, d) { return (v == null || !isFinite(v)) ? "—" : v.toFixed(d == null ? 2 : d); }
  function mn(a) { return Math.min.apply(null, a); }
  function mx(a) { return Math.max.apply(null, a); }
  /* 刻度标签：绝对定位的 HTML，不受 SVG 横向拉伸影响。
     above=true 时贴在 y 上方，否则贴在下方。 */
  function axl(txt, y, above, side) {
    return '<div class="axl" style="' + (side === "left" ? "left:2px" : "right:2px") +
      ';top:' + (y + (above ? -3 : 3)).toFixed(1) + 'px' +
      (above ? ';transform:translateY(-100%)' : '') + '">' + esc(txt) + '</div>';
  }

  /* 给容器挂上十字光标交互。getHTML(i) 返回 tooltip 内容 */
  function bind(host, n, pad, getHTML, onIdx) {
    var svg = host.querySelector("svg");
    var tip = host.querySelector(".tip");
    var cx = host.querySelector(".cx");
    if (!svg || !n) return;
    function move(ev) {
      var r = svg.getBoundingClientRect();
      var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      var f = (x - pad.l * r.width / pad.W) / ((pad.W - pad.l - pad.r) * r.width / pad.W);
      var i = Math.round(f * (n - 1));
      if (i < 0) i = 0; if (i > n - 1) i = n - 1;
      var px = pad.l + (n > 1 ? i / (n - 1) : .5) * (pad.W - pad.l - pad.r);
      if (cx) { cx.setAttribute("x1", px); cx.setAttribute("x2", px); cx.style.opacity = 1; }
      if (tip) {
        tip.innerHTML = getHTML(i);
        tip.classList.add("on");
        var rel = px / pad.W * r.width;
        var tw = tip.offsetWidth || 150;
        var left = rel + 14;
        if (left + tw > r.width) left = rel - tw - 14;
        if (left < 0) left = 4;
        tip.style.left = left + "px";
        tip.style.top = "34px";
      }
      if (onIdx) onIdx(i);
    }
    function leave() {
      if (cx) cx.style.opacity = 0;
      if (tip) tip.classList.remove("on");
      if (onIdx) onIdx(-1);
    }
    svg.addEventListener("mousemove", move);
    svg.addEventListener("mouseleave", leave);
    svg.addEventListener("touchstart", move, { passive: true });
    svg.addEventListener("touchmove", move, { passive: true });
    svg.addEventListener("touchend", leave);
  }

  /* ---------- 日线K线 + 均线 + 信号标记 + 分数副图 ---------- */
  function candles(daily, opt) {
    opt = opt || {};
    var n = opt.bars || 90;
    var off = Math.max(0, daily.length - n);
    var d = daily.slice(off);
    if (d.length < 5) return { html: "", bind: function () { } };
    var W = 900, H = opt.h || 230, SH = opt.scoreH == null ? 62 : opt.scoreH;
    var PT = 10, PB = 16, PL = 4, PR = 6, GAP = 12;
    var lo = mn(d.map(function (x) { return x.l; })), hi = mx(d.map(function (x) { return x.h; }));
    var ma5 = opt.ma5 || [], ma20 = opt.ma20 || [];
    ma5.concat(ma20).forEach(function (v) { if (isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } });
    var padv = (hi - lo) * 0.07 || 1; lo -= padv; hi += padv;
    var CW = (W - PL - PR) / d.length, bw = Math.max(1.5, Math.min(9, CW * 0.6));
    function X(i) { return PL + i * CW + CW / 2; }
    function Y(v) { return PT + (hi - v) / (hi - lo) * (H - PT - PB); }
    var id = "c" + (++uid);
    var s = '<svg viewBox="0 0 ' + W + ' ' + (H + GAP + SH) + '" preserveAspectRatio="none" ' +
      'style="width:100%;height:' + (H + GAP + SH) + 'px">';
    /* 横向网格；价格刻度放到 HTML 覆盖层 */
    var lab = "";
    [0, .25, .5, .75, 1].forEach(function (f) {
      var y = PT + f * (H - PT - PB);
      var v = hi - f * (hi - lo);
      s += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) +
        '" stroke="#222733" stroke-width="1"' + (f === 0 || f === 1 ? '' : ' stroke-dasharray="2 5"') + '/>';
      lab += axl(fx(v, v > 100 ? 1 : 3), y, f === 1);
    });
    /* K线 */
    d.forEach(function (b, i) {
      var up = b.c >= b.o, col = up ? "#ff4d5e" : "#16c784", x = X(i);
      s += '<line x1="' + x.toFixed(1) + '" y1="' + Y(b.h).toFixed(1) + '" x2="' + x.toFixed(1) +
        '" y2="' + Y(b.l).toFixed(1) + '" stroke="' + col + '" stroke-width="1"/>';
      var y1 = Y(Math.max(b.o, b.c)), y2 = Y(Math.min(b.o, b.c));
      s += '<rect x="' + (x - bw / 2).toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + Math.max(1, y2 - y1).toFixed(1) + '" fill="' + col + '"/>';
    });
    function poly(arr, col) {
      var pts = [];
      arr.forEach(function (v, i) { if (isFinite(v)) pts.push(X(i).toFixed(1) + "," + Y(v).toFixed(1)); });
      return pts.length > 1 ? '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + col +
        '" stroke-width="1.3" stroke-linejoin="round" opacity=".92"/>' : "";
    }
    s += poly(ma5, "#f5a524") + poly(ma20, "#5b8cff");
    /* 信号标记 */
    (opt.marks || []).forEach(function (m) {
      if (m.i < 0 || m.i >= d.length) return;
      var x = X(m.i), sell = m.dir > 0;
      var y = sell ? Y(d[m.i].h) - 9 : Y(d[m.i].l) + 9;
      var col = sell ? "#ff4d5e" : "#16c784";
      var tri = sell ? (x - 4.5) + "," + (y - 1) + " " + (x + 4.5) + "," + (y - 1) + " " + x + "," + (y + 5.5)
        : (x - 4.5) + "," + (y + 1) + " " + (x + 4.5) + "," + (y + 1) + " " + x + "," + (y - 5.5);
      s += '<polygon points="' + tri + '" fill="' + col + '"/>';
    });
    /* 最新价虚线 */
    var lc = d[d.length - 1].c;
    s += '<line x1="' + PL + '" y1="' + Y(lc).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + Y(lc).toFixed(1) +
      '" stroke="#96a0b2" stroke-width="1" stroke-dasharray="4 4" opacity=".45"/>';
    /* 分数副图 */
    var sc = (opt.scores || []).slice(Math.max(0, (opt.scores || []).length - d.length));
    if (SH && sc.length) {
      var y0 = H + GAP, mid = y0 + SH / 2;
      var vals = sc.filter(function (v) { return v != null && isFinite(v); });
      var smx = vals.length ? Math.max(.5, mx(vals.map(Math.abs))) : 1;
      s += '<rect x="' + PL + '" y="' + y0 + '" width="' + (W - PL - PR) + '" height="' + SH +
        '" fill="#0e1116" rx="4"/>';
      s += '<line x1="' + PL + '" y1="' + mid + '" x2="' + (W - PR) + '" y2="' + mid +
        '" stroke="#2d3340" stroke-width="1"/>';
      sc.forEach(function (v, i) {
        if (v == null || !isFinite(v)) return;
        var h2 = Math.abs(v) / smx * (SH / 2 - 3);
        s += '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + (v >= 0 ? mid - h2 : mid).toFixed(1) +
          '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h2).toFixed(1) +
          '" fill="' + (v >= 0 ? "#ff4d5e" : "#16c784") + '" opacity=".7"/>';
      });
      lab += axl("合成分", y0 + 12, false, "left");
    }
    s += '<line class="cx" x1="0" y1="0" x2="0" y2="' + (H + GAP + SH) +
      '" stroke="#96a0b2" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
    s += '</svg>';
    var html = '<div class="chart" id="' + id + '"><div class="ch"><b>' + esc(opt.title || "日线") +
      '</b><span>' + esc(d[0].d) + " ~ " + esc(d[d.length - 1].d) + '</span></div>' +
      '<div class="cw">' + s + lab + '</div>' +
      '<div class="tip"></div><div class="lg">' +
      '<span><i style="background:#f5a524"></i>MA5</span>' +
      '<span><i style="background:#5b8cff"></i>MA20</span>' +
      (opt.lgSell === "" ? "" : '<span><i class="sq" style="background:#ff4d5e"></i>▼ ' +
        esc(opt.lgSell || "倒T触发") + '</span>') +
      '<span><i class="sq" style="background:#16c784"></i>▲ ' + esc(opt.lgBuy || "正T触发") + '</span></div></div>';
    return {
      html: html,
      bind: function () {
        var host = document.getElementById(id);
        if (!host) return;
        bind(host, d.length, { W: W, l: PL, r: PR }, function (i) {
          var b = d[i], sv = sc[i];
          var pct = b.pct != null ? b.pct : 0;
          return '<div class="tt">' + esc(b.d) + '</div>' +
            '<div class="tr"><span>收</span><b class="' + (pct >= 0 ? "up" : "dn") + '">' + fx(b.c, 2) + '</b></div>' +
            '<div class="tr"><span>涨跌</span><b class="' + (pct >= 0 ? "up" : "dn") + '">' +
            (pct >= 0 ? "+" : "") + fx(pct, 2) + '%</b></div>' +
            '<div class="tr"><span>高/低</span><b>' + fx(b.h, 2) + " / " + fx(b.l, 2) + '</b></div>' +
            (sv != null && isFinite(sv) ? '<div class="tr"><span>合成分</span><b>' + fx(sv, 2) + '</b></div>' : "");
        });
      }
    };
  }

  /* ---------- 资金曲线 ---------- */
  function equity(trades, opt) {
    opt = opt || {};
    if (!trades || trades.length < 2) return { html: "", bind: function () { } };
    var cum = 0, pts = [{ v: 0, t: null }];
    trades.forEach(function (t) { cum += t.net; pts.push({ v: cum, t: t }); });
    var W = 900, H = 170, PT = 10, PB = 14, PL = 4, PR = 6;
    var vs = pts.map(function (p) { return p.v; });
    var lo = mn(vs), hi = mx(vs);
    if (hi - lo < 1) hi = lo + 1;
    var pad = (hi - lo) * .08; lo -= pad; hi += pad;
    function X(i) { return PL + i / (pts.length - 1) * (W - PL - PR); }
    function Y(v) { return PT + (hi - v) / (hi - lo) * (H - PT - PB); }
    var col = cum >= 0 ? "#ff4d5e" : "#16c784";   /* A股习惯：盈利用红 */
    var id = "e" + (++uid);
    var line = pts.map(function (p, i) { return X(i).toFixed(1) + "," + Y(p.v).toFixed(1); });
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px">';
    s += '<defs><linearGradient id="g' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + col + '" stop-opacity=".3"/>' +
      '<stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>';
    var lab = "";
    [0, .5, 1].forEach(function (f) {
      var y = PT + f * (H - PT - PB), v = hi - f * (hi - lo);
      s += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) +
        '" stroke="#222733" stroke-width="1" stroke-dasharray="2 5"/>';
      lab += axl(fx(v, 0) + " bp", y, f === 1);
    });
    s += '<line x1="' + PL + '" y1="' + Y(0).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + Y(0).toFixed(1) +
      '" stroke="#3a4252" stroke-width="1"/>';
    s += '<polygon points="' + line.join(" ") + " " + X(pts.length - 1).toFixed(1) + "," + Y(lo).toFixed(1) +
      " " + X(0).toFixed(1) + "," + Y(lo).toFixed(1) + '" fill="url(#g' + id + ')"/>';
    s += '<polyline points="' + line.join(" ") + '" fill="none" stroke="' + col +
      '" stroke-width="1.8" stroke-linejoin="round"/>';
    s += '<line class="cx" x1="0" y1="0" x2="0" y2="' + H +
      '" stroke="#96a0b2" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
    s += '</svg>';
    var peak = -1e18, mdd = 0;
    vs.forEach(function (v) { peak = Math.max(peak, v); mdd = Math.max(mdd, peak - v); });
    var html = '<div class="chart" id="' + id + '"><div class="ch"><b>累计净收益（bp）</b>' +
      '<span>终值 ' + fx(cum, 0) + 'bp · 最大回撤 ' + fx(mdd, 0) + 'bp · ' + trades.length + ' 笔</span></div>' +
      '<div class="cw">' + s + lab + '</div><div class="tip"></div></div>';
    return {
      html: html,
      bind: function () {
        var host = document.getElementById(id);
        if (!host) return;
        bind(host, pts.length, { W: W, l: PL, r: PR }, function (i) {
          var p = pts[i];
          if (!p.t) return '<div class="tt">起点</div><div class="tr"><span>累计</span><b>0 bp</b></div>';
          return '<div class="tt">第 ' + i + ' 笔 · ' + esc(p.t.d) + '</div>' +
            '<div class="tr"><span>标的</span><b>' + esc(p.t.name || p.t.code || "") + '</b></div>' +
            '<div class="tr"><span>方向</span><b>' + (p.t.dir > 0 ? "倒T" : "正T") + '</b></div>' +
            '<div class="tr"><span>本笔</span><b class="' + (p.t.net >= 0 ? "up" : "dn") + '">' +
            (p.t.net >= 0 ? "+" : "") + fx(p.t.net, 0) + ' bp</b></div>' +
            '<div class="tr"><span>累计</span><b>' + fx(p.v, 0) + ' bp</b></div>';
        });
      }
    };
  }

  /* ---------- 收益分布 ---------- */
  function hist(vals, opt) {
    opt = opt || {};
    if (!vals || vals.length < 6) return { html: "", bind: function () { } };
    var W = 900, H = 130, PT = 8, PB = 18, PL = 6, PR = 10, B = 25;
    var cap = mx(vals.map(Math.abs)) || 1, lo = -cap, hi = cap;
    var step = (hi - lo) / B, bins = new Array(B).fill(0);
    vals.forEach(function (v) { bins[Math.max(0, Math.min(B - 1, Math.floor((v - lo) / step)))]++; });
    var bmx = mx(bins) || 1, bw = (W - PL - PR) / B;
    var id = "h" + (++uid);
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px">';
    var midX = PL + (0 - lo) / (hi - lo) * (W - PL - PR);
    bins.forEach(function (c, i) {
      if (!c) return;
      var h2 = c / bmx * (H - PT - PB);
      var cl = lo + (i + .5) * step;
      s += '<rect x="' + (PL + i * bw + .7).toFixed(1) + '" y="' + (H - PB - h2).toFixed(1) +
        '" width="' + (bw - 1.4).toFixed(1) + '" height="' + h2.toFixed(1) + '" fill="' +
        (cl >= 0 ? "#ff4d5e" : "#16c784") + '" opacity=".62" rx="1.5"/>';
    });
    s += '<line x1="' + midX.toFixed(1) + '" y1="' + PT + '" x2="' + midX.toFixed(1) + '" y2="' + (H - PB) +
      '" stroke="#3a4252" stroke-width="1"/>';
    s += '</svg>';
    var lab = axl(fx(lo, 0) + " bp", H - 4, true, "left") + axl(fx(hi, 0) + " bp", H - 4, true);
    var m = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    var w = vals.filter(function (v) { return v > 0; }).length;
    return {
      html: '<div class="chart" id="' + id + '"><div class="ch"><b>每笔净收益分布（bp）</b>' +
        '<span>均值 ' + fx(m, 1) + ' · 胜率 ' + fx(w / vals.length * 100, 1) + '%</span></div>' +
        '<div class="cw">' + s + lab + '</div></div>',
      bind: function () { }
    };
  }

  /* ---------- 带置信区间的横条 ---------- */
  function ciBars(rows, opt) {
    opt = opt || {};
    if (!rows.length) return "";
    var all = [];
    rows.forEach(function (r) { all.push(r.lo, r.hi, r.v, 0); });
    var lo = mn(all), hi = mx(all), sp = (hi - lo) || 1;
    lo -= sp * .1; hi += sp * .1;
    function P(v) { return (v - lo) / (hi - lo) * 100; }
    var s = '<div style="position:relative">' +
      '<div style="position:absolute;left:' + P(0).toFixed(1) + '%;top:0;bottom:0;width:1px;' +
      'background:var(--line2);z-index:0"></div>';
    rows.forEach(function (r) {
      var good = r.lo > 0, bad = r.hi < 0;
      var col = good ? "#16c784" : (bad ? "#ff4d5e" : "#f5a524");
      s += '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;position:relative;z-index:1">' +
        '<div style="width:104px;font-size:12px;color:var(--tx2);flex-shrink:0;overflow:hidden;' +
        'text-overflow:ellipsis;white-space:nowrap">' + esc(r.label) + '</div>' +
        '<div style="flex:1;position:relative;height:18px">' +
        '<div style="position:absolute;top:8.5px;height:1.5px;background:' + col + ';opacity:.45;left:' +
        P(r.lo).toFixed(1) + '%;width:' + Math.max(.4, P(r.hi) - P(r.lo)).toFixed(1) + '%"></div>' +
        '<div style="position:absolute;top:3px;height:12px;width:2.5px;border-radius:2px;background:' + col +
        ';left:calc(' + P(r.v).toFixed(1) + '% - 1.25px)"></div></div>' +
        '<div style="width:62px;text-align:right;font-size:12px;color:' + col + ';font-weight:600;' +
        'flex-shrink:0">' + fx(r.v, 1) + '</div>' +
        '<div style="width:36px;text-align:right;font-size:10.5px;color:var(--tx4);flex-shrink:0">' +
        (r.n != null ? r.n : "") + '</div></div>';
    });
    return s + '</div>';
  }

  /* ---------- 分位条 ---------- */
  function gauge(pct, needBuy, needSell, score) {
    return '<div class="gauge"><div class="tk"><div class="fl"></div>' +
      '<div class="gt" style="left:' + needBuy + '%"><b style="left:4px">正T线 ' + needBuy + '</b></div>' +
      '<div class="gt" style="left:' + needSell + '%"><b style="right:4px;left:auto">倒T线 ' + needSell + '</b></div>' +
      '<div class="pin" style="left:calc(' + Math.max(0, Math.min(100, pct)) + '% - 1.5px)"></div></div>' +
      '<div class="cap"><span>历史最低</span><span>当前 <b class="ac">' + fx(pct, 0) +
      '%</b> 分位 · 合成分 ' + fx(score, 2) + '</span><span>历史最高</span></div></div>';
  }

  /* ---------- 因子条 ---------- */
  function facRow(label, z, w) {
    var v = Math.max(-3.5, Math.min(3.5, z || 0));
    var p = Math.abs(v) / 3.5 * 50;
    var left = v >= 0 ? 50 : 50 - p;
    var col = v >= 0 ? "#ff4d5e" : "#16c784";
    return '<div class="fr"><div class="fn">' + esc(label) + '</div><div class="fb"><div class="md"></div>' +
      '<i style="left:' + left.toFixed(1) + '%;width:' + p.toFixed(1) + '%;background:' + col +
      ';opacity:' + (0.35 + 0.65 * Math.min(1, (w || 0) / 100)).toFixed(2) + '"></i></div>' +
      '<div class="fv">' + fx(z, 2) + '</div></div>';
  }

  return { candles: candles, equity: equity, hist: hist, ciBars: ciBars,
    gauge: gauge, facRow: facRow, esc: esc, fx: fx };
})();

</script>

function scCodes() {

        if (inList[c]) { SC.D[c] = o; ok++; } else SC.PX[c] = o;   /* 只是拿来出信号的（不在列表里）单独放 */
      }, function () { });
    })).then(function () {

function scSig(D, k) {
  var sv = D.ser[k]; if (!sv) return false;
  var ms = MKT ? MKT[sv.d] : null;
  return sv.pct <= 10 && !!ms && !ms.calm;
}
/* 某只 ETF 当前要做的事 */
function scState(D) {
  var n = D.daily.length, today = bjDate(), m = bjMin(), wk = isWk();
  var hasToday = D.daily[n - 1].d === today, prov = hasToday && wk && m < 902;
  var morning = !hasToday && wk && m < 570;

    if (prov && k === n - 1) continue;
    if (!scSig(D, k)) continue;
    var b = k + 1, e = k + 2, st = null;
    if (b > n - 1) st = { t: "buy", txt: morning ? "今天 9:30 开盘买" : "下个交易日开盘买" };
    else if (b === n - 1 && prov) st = m < 570 ? { t: "buy", txt: "今天 9:30 开盘买" }
      : { t: "hold", txt: "今天开盘已买。有底仓：今天收盘卖同样数量；没底仓：明天收盘卖" };
    else if (e > n - 1) st = { t: "hold2", txt: morning || (wk && !hasToday && m < 900) ? "没底仓的：今天收盘卖" : "没底仓的：下个交易日收盘卖（有底仓的已在买入当天卖掉）" };
    else if (e === n - 1 && prov) st = { t: "sell", txt: "没底仓的：今天收盘卖" };
    if (st) res.push({ d: D.daily[k].d, pct: D.ser[k].pct, st: st });
  }
  if (prov && m >= 570 && D.ser[n - 1] && D.ser[n - 1].pct <= 10) {
    var ms = MKT ? MKT[D.daily[n - 1].d] : null;
    if (ms && !ms.calm) res.push({ d: today, pct: D.ser[n - 1].pct, st: { t: "prov", txt: "盘中预备：收盘时仍成立，明天开盘买" } });
  }

}
/* 触发价：下一个要判断的那个收盘，收在多少以下会触发（同时要上证收跌）。
   最后一根K的分数只取决于它自己的「当日涨跌 / 相对上证 / 连涨连跌」，标准化窗口和分位窗口都是之前的数据，
   所以分位对收盘价单调，可以二分。盘中用当天真实的高低和上证实时涨跌；盘外按下一个交易日、假设上证收跌 0.5%、平开。 */
function scTrigger(D) {

  var pre = hasToday && wk && m < 570;   /* 竞价时东财可能已经给出当日K，按盘前处理 */

  if (!D.trSer || D.trN !== nb || D.trLast !== base[nb - 1].c) { D.trSer = SW.buildSeries(base, BENCH, SC_P); D.trN = nb; D.trLast = base[nb - 1].c; }
  var ser = D.trSer, keys = ["day1", "rs", "run"], win = [], scores = [];

  win = win.slice(-SC_P.normWin); scores = scores.slice(-SC_P.pctWin);
  if (win.length < 60 || scores.length < 60) return null;
  var mu = {}, sd = {};
  keys.forEach(function (k) { var col = win.map(function (f) { return f[k]; }); mu[k] = SW.mean(col); sd[k] = SW.stdev(col) || 1; });
  var bkey = live ? today : "9999-12-31", bp = live && isFinite(BENCH[today]) ? BENCH[today] : -0.5;
  var bmap = Object.create(BENCH); bmap[bkey] = bp;
  function pctAt(c) {
    var o = cur ? cur.o : pc, h = Math.max(cur ? cur.h : Math.max(o, pc), c), l = Math.min(cur ? cur.l : Math.min(o, pc), c);
    var t = { d: bkey, o: o, h: h, l: l, c: c, vol: cur ? cur.vol : base[nb - 1].vol, amt: 0, pct: (c / pc - 1) * 100 };
    var f = SW.factorsAt(base.concat([t]), nb, bmap); if (!f) return 100;
    var s = 0; keys.forEach(function (k) { s += Math.max(-4, Math.min(4, (f[k] - mu[k]) / sd[k])); });

  if (pctAt(hi) <= 10) return { px: hi, pc: pc, live: live, bp: bp, ref: cur ? cur.c : pc, pd: pd };
  for (var it = 0; it < 30; it++) { var mid = (lo + hi) / 2; if (pctAt(mid) <= 10) lo = mid; else hi = mid; }
  var ref = cur ? cur.c : pc;

}
/* 用同指数 ETF 出信号的：触发价按它算，再按同一天的收盘价比例换算成自己的价格（两只同涨同跌） */
function scTriggerOf(D) {
  if (!D.proxy) return scTrigger(D);
  var P = SC.D[D.proxy] || SC.PX[D.proxy]; if (!P) return null;
  var t = scTrigger(P); if (!t || !(t.pc > 0)) return null;
  var b = null; for (var i = D.daily.length - 1; i >= 0; i--) if (D.daily[i].d === t.pd) { b = D.daily[i]; break; }
  if (!b) return null;
  var k = b.c / t.pc, o = {}; for (var key in t) o[key] = t[key];
  ["px", "pc", "ref"].forEach(function (x) { if (isFinite(o[x])) o[x] = o[x] * k; });
  o.via = D.proxy; return o;

function scShares(px) {
  var amt = S.F.notional > 0 ? S.F.notional : 50000;
  return px > 0 ? Math.floor(amt / px / 100) * 100 : 0;

/* 冻结日之后的前向记分（两种做法） */
function scForward() {
  var today = bjDate(), m = bjMin(), out = { base: [], nb: [] };

<script>

function icsDownload() {
  var txt = icsText();
  function showText(msg) {
    var ta = $("icsOut");
    if (ta) { ta.style.display = "block"; ta.value = txt; try { ta.select(); } catch (e) { } }
    toast(msg || "这里不能直接下载，已把内容显示出来——复制后存成 .ics 文件");
  }
  function blobTry() {
    try {
      var b = new Blob([txt], { type: "text/calendar;charset=utf-8" });
      var u = URL.createObjectURL(b), a = document.createElement("a");
      a.href = u; a.download = "zuoT-reminder.ics";
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 1000);
      toast("已导出，用手机日历打开它");
    } catch (e) { showText(); }
  }
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) { blobTry(); return; }
      dl.save({ filename: "zuoT-reminder.ics", data: txt })
        .then(function () { toast("已保存，用手机日历打开它"); }, function () { showText(); });
    }, function () { blobTry(); });
    return;
  }
  blobTry();
}

function actionBars(D, long) {
  if (!covered(D)) {
    return long ? '<div class="action block"><div class="ai">⊘</div><div style="flex:1"><div class="ah">' + esc(D.name) +
      ' · 个股，规则不覆盖</div><div class="ab">同一条规则在 <em>255 只随机抽取的个股</em>上是 +17.7bp/笔，t=0.96——' +
      '没有被证实。所以 v3 不对个股给信号。<br>页面照常显示行情和回测，仅供参考。</div></div></div>' : "";
  }
  var st = stateOf(D), h = "";
  if (!st) {
    return '<div class="action block"><div class="ai">⊘</div><div><div class="ah">' + esc(D.name) +
      ' · 历史不够</div><div class="ab">只有 ' + D.daily.length + ' 根日线、可出信号 ' + D.nValid +
      ' 天。需要约 8 个月以上的上市历史。</div></div></div>';
  }
  var px = D.q && D.q.now ? D.q.now : D.daily[D.daily.length - 1].c;
  var cost = SW.costOf(px, D.kind, S.F);
  var tb = D.daily[st.i];
  if (st.hold && st.hold.dir && tb && tb.o > 0) {
    var cur = st.phase === "open" && D.q && D.q.now ? D.q.now : tb.c;
    var pnl = (cur / tb.o - 1) * 1e4 - SW.costOf(tb.o, D.kind, S.F).total;
    if (st.phase === "open") {
      h += '<div class="action sell"><div class="ai">◆</div><div style="flex:1;min-width:0">' +
        '<div class="ah">' + esc(D.name) + ' · 今天收盘前平仓</div>' +
        '<div class="ab">昨天收盘触发了候选规则（分位 <em>' + fx(st.hold.pct, 0) + '%</em>），' +
        '按规则今天开盘买入一份。<em>收盘前卖出同样数量</em>，不留过夜。<br>' +
        '今开 ' + fx(tb.o, 3) + ' → 现价 ' + fx(cur, 3) + '，这笔目前 <em>' + sgn(pnl, 0) + 'bp</em>（已扣成本）。' +

    } else {

        '<div class="ab">开 ' + fx(tb.o, 3) + ' → 收 ' + fx(tb.c, 3) + '，扣成本后 <em class="' + cl(pnl) + '">' +
        sgn(pnl, 0) + 'bp</em>。' + (st.hold.d >= FREEZE ? '已记入前向记分牌。' : '') + '</div></div></div>';
    }
  }
  var c = st.next;
  if (c.dir) {
    var conf = !st.prov;
    h += '<div class="action buy"><div class="ai">▲</div><div style="flex:1;min-width:0">' +
      '<div class="ah">' + esc(D.name) + ' · ' + (conf ? st.when + "买入" : "预备信号（收盘后确认）") + '</div>' +
      '<div class="ab">合成分处于自身近120个信号日的 <em>' + fx(c.pct, 0) + '%</em> 分位（≤' + S.P.q +
      ' 触发），且当天大盘下跌。<br>' +
      (conf ? '做法：<em>' + st.when + '买一份，当天收盘前卖出同样数量</em>。不隔夜、不设止损，来回成本约 ' + fx(cost.total, 1) + 'bp。'
        : '现在还没收盘，这是按现价临时算的。<em>收盘时仍成立</em>才是信号，成立则下个交易日开盘买一份、当天收盘前卖掉。') +
      '<br><span class="m">候选规则，未经前向验证：' + evLine(D.kind) + '。</span></div></div></div>';
  } else if (long) {
    var ah, ab;
    if (c.why === "mkt") {

        "<em>−15.4bp</em>（t=−1.23），所以规则只在大盘下跌日出手。";
    } else if (c.why === "dir") {
      ah = "超买了——但高抛这个方向没有优势，不做";
      ab = "分位 <em>" + fx(c.pct, 0) + "%</em>。v1 会在这里给倒T信号。三年复检：倒T 当日 −2.2bp（t=−0.15）、" +

    } else {
      ah = "观望";
      ab = "分位 <em>" + fx(c.pct, 0) + "%</em>，距触发线（≤" + S.P.q + "%）还差 <em>" +
        fx(Math.max(0, c.pct - S.P.q), 0) + "</em> 个分位。";
    }
    if (st.prov) ab += '<br><span class="ac">还没收盘，按现价临时算的，收盘前会变。</span>';
    h += '<div class="action' + (c.why ? " block" : "") + '"><div class="ai">' + (c.why ? "⊘" : "—") +

  }).join("") || '<div class="sub">还没有标的</div>';

  var crow = [[0.5, "etf"], [1, "etf"], [2, "etf"], [5, "etf"], [20, "stock"], [100, "stock"], [300, "stock"]]
    .map(function (x) {
      var c = SW.costOf(x[0], x[1], S.F);
      return '<tr><td>' + x[0] + ' 元 · ' + (x[1] === "etf" ? "ETF" : "股票") + '</td>' +
        '<td class="r">' + fx(c.tickBp, 1) + '</td><td class="r">' + fx(c.commBp, 1) + '</td>' +
        '<td class="r">' + fx(c.stampBp, 1) + '</td>' +
        '<td class="r ' + (c.total > 12 ? "wr" : (c.total < 7 ? "ac" : "")) + '"><b>' + fx(c.total, 1) + '</b></td></tr>';
    }).join("");
  $("costDemo").innerHTML = '<div class="tw" style="margin-top:10px"><table><thead><tr>' +
    '<th>价格 / 类型</th><th class="r">一跳bp</th><th class="r">佣金bp</th>' +
    '<th class="r">印花bp</th><th class="r">合计bp</th></tr></thead><tbody>' + crow + '</tbody></table></div>' +
    '<div class="sub">候选规则的边际约 25bp/笔。来回成本超过 10bp 的品种（比如 1 元以下的 ETF），剩下的就不多了。</div>';

  Array.prototype.forEach.call($("ilist2").querySelectorAll("[data-del]"), function (b) {
    b.onclick = function () { var c = S.inst[+this.dataset.del]; S.inst.splice(+this.dataset.del, 1);
      if (c) delete DATA[c.code]; save(); render(); };
  });
  $("btnAdd").onclick = function () {
    var c = String($("f_code").value).replace(/\D/g, "");
    if (c.length < 6) { toast("请输入6位代码"); return; }
    if (S.inst.some(function (x) { return x.code === c; })) { toast("已存在"); return; }
    S.inst.push({ code: c, kind: $("f_kind").value });
    save(); toast("已添加，正在加载"); render(); refresh();
  };
  [["s_notional", "notional"], ["s_commRate", "commRate"], ["s_commMin", "commMin"], ["s_slip", "slipTicks"]]
    .forEach(function (p) { $(p[0]).onchange = function () { S.F[p[1]] = num(this.value); save(); render(); }; });
  $("p_q").onchange = function () { S.P.q = Math.max(2, Math.min(30, num(this.value) || 10)); save(); recompute(); render(); };
  $("p_gate").onchange = function () { S.P.useGate = +this.value; save(); recompute(); render(); };
  $("p_alarm").onchange = function () { S.P.alarm = +this.value; save(); render(); };
  var bn = $("btnNotif"); if (bn) bn.onclick = notifAsk;
  var bt = $("btnNotifTest"); if (bt) bt.onclick = function () {
    var hn = heroNext(todo());
    toast(notifSend("测试 · " + hn.t, hn.note) ? "已发送，看通知栏" : "发送失败，检查系统通知设置");
  };
  $("btnIcs").onclick = icsDownload;
  $("btnClear").onclick = function () {
    if (!confirm("清空本地保存的标的和参数？")) return;
    try { localStorage.removeItem(KEY); } catch (e) { }
    location.reload();
  };
}

/* ===== 事件 ===== */
Array.prototype.forEach.call($("nav").querySelectorAll("button"), function (b) {
  b.onclick = function () { go(this.dataset.p); };
});
$("btnRefresh").onclick = function () { refresh(); };
document.addEventListener("click", function (e) {
  var n = e.target;
  while (n && n !== document && !(n.dataset && n.dataset.go)) n = n.parentNode;
  if (n && n.dataset && n.dataset.go) go("detail", n.dataset.go);
});
setInterval(function () {
  $("mkt").textContent = mktLabel();
  $("mkt").className = "pill " + (mktOpen() ? "good" : "dim");
  if (PAGE === "dash") { var e = $("cd"); if (e) e.textContent = heroNext(todo()).t; }
}, 20000);

/* 自动取数：点开就是最新的。回到前台 / 获得焦点 / 盘中每分钟（节流 45 秒） */
function maybeRefresh(minAge) {
  if (busy || document.hidden) return;
  if (Date.now() - lastFetchAt < (minAge == null ? 45000 : minAge)) return;
  refresh();
}
document.addEventListener("visibilitychange", function () { if (!document.hidden) maybeRefresh(); });
window.addEventListener("focus", function () { maybeRefresh(); });
window.addEventListener("pageshow", function () { maybeRefresh(); });
/* 15:02~15:08 再自动刷几次：拿到收盘后的最终报价，15:05 起把今天这根写回手机 */
setInterval(function () { var m = bjMin(); if (mktOpen() || (isWk() && ((m >= 555 && m < 570) || (m >= 902 && m <= 908)))) maybeRefresh(60000); }, 30000);

render();
refresh();

</script>
</body>
</html>
