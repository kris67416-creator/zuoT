<style>
/* ===== 设计变量：全部取自 WeUI（微信官方 UI 库 Tencent/weui，MIT），深浅色跟着系统或「设置」切换 ===== */
body{
  --bg:var(--weui-BG-0); --bg2:var(--weui-BG-1); --surf:var(--weui-BG-2); --surf2:var(--weui-BG-1); --surf3:var(--weui-BG-3);
  --line:var(--weui-FG-3); --line2:var(--weui-FG-4); --line3:var(--weui-FG-2);
  --tx:var(--weui-FG-0); --tx2:rgba(0,0,0,.7); --tx3:var(--weui-FG-1); --tx4:var(--weui-FG-2);
  --up:var(--weui-RED); --dn:var(--weui-BRAND); --warn:var(--weui-ORANGE); --acc:var(--weui-INDIGO);
  --tagR:var(--weui-TAG-BACKGROUND-RED); --tagG:var(--weui-TAG-BACKGROUND-GREEN); --tagO:var(--weui-TAG-BACKGROUND-ORANGE);
  --tagB:var(--weui-TAG-BACKGROUND-BLUE); --tagK:var(--weui-TAG-BACKGROUND-BLACK);
  --btn2:rgba(0,0,0,.05); --shadow:0 4px 18px rgba(0,0,0,.12);
  --r:12px; --r2:8px; --r3:6px;
  background:var(--bg); color:var(--tx);
  font:15px/1.6 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; overflow-x:hidden;
}
body[data-weui-theme="dark"]{--tx2:hsla(0,0%,100%,.65);--btn2:hsla(0,0%,100%,.08);--shadow:0 4px 18px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){body:not([data-weui-theme="light"]){--tx2:hsla(0,0%,100%,.65);--btn2:hsla(0,0%,100%,.08);--shadow:0 4px 18px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
a{color:var(--acc);text-decoration:none;cursor:pointer}
button{font-family:inherit}

/* ===== 框架：顶栏 + 内容 + 底部标签栏（weui-tabbar） ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top));background:var(--bg);border-bottom:.5px solid var(--line)}
.topbar .tt{min-width:0}
.topbar h2{font-size:17px;font-weight:600;line-height:1.3;margin:0}
.topbar .st{font-size:11.5px;color:var(--tx3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px calc(78px + env(safe-area-inset-bottom))}
#nav.weui-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40}
#nav .weui-tabbar__item{border:0;background:none;cursor:pointer;font-family:inherit}
#nav .weui-tabbar__icon{width:24px;height:24px;margin:1px 0 1px}
#nav .tbi{position:relative;display:inline-block;line-height:0}
#navDot{position:absolute;top:-1px;right:-4px;display:none}
.page{display:none}.page.on{display:block}
.fade{animation:fd .2s ease}
@keyframes fd{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== 通用组件 ===== */
.card{background:var(--surf);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;color:var(--tx);line-height:1.4}
.card h3 .r{margin-left:auto;font-size:12px;font-weight:400;color:var(--tx3);text-align:right}
.sub{font-size:13px;color:var(--tx3);line-height:1.65;margin-top:8px}
.sub b{color:var(--tx2);font-weight:600}
.m{color:var(--tx3)}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--tx2)}
.wr{color:var(--warn)}.ac{color:var(--acc)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.kpi{background:var(--surf2);border-radius:var(--r2);padding:9px 12px}
.kpi .k{font-size:12px;color:var(--tx3)}
.kpi .v{font-size:20px;font-weight:600;margin-top:1px;line-height:1.25}
.kpi .s{font-size:11.5px;color:var(--tx4);margin-top:1px}

.pill{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;line-height:1.55;padding:1px 7px;border-radius:4px;
  font-weight:500;white-space:nowrap;vertical-align:1px}
.pill.good{background:var(--tagG);color:var(--dn)}
.pill.bad{background:var(--tagR);color:var(--up)}
.pill.warn{background:var(--tagO);color:var(--warn)}
.pill.info{background:var(--tagB);color:var(--acc)}
.pill.dim{background:var(--tagK);color:var(--tx3)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:var(--r2);
  height:36px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--weui-BRAND);color:#fff;white-space:nowrap}
.btn:active{opacity:.75}
.btn:disabled{opacity:.4;cursor:default}
.btn.g{background:var(--btn2);color:var(--tx)}
.btn.sm{height:30px;padding:0 12px;font-size:13px;border-radius:var(--r3)}
.btn.danger{background:var(--tagR);color:var(--up)}

.seg{display:inline-flex;background:var(--btn2);border-radius:var(--r2);padding:2px;gap:2px}
.seg button{background:none;border:0;color:var(--tx2);padding:5px 12px;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surf);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}

label:not([class^="weui"]){display:block;font-size:12px;color:var(--tx3);margin-bottom:4px}
input:not([class^="weui"]),select:not([class^="weui"]),textarea:not([class^="weui"]){width:100%;background:var(--surf2);border:0;color:var(--tx);
  border-radius:var(--r2);padding:8px 10px;font-size:15px;font-family:inherit;outline:none}
input:not([class^="weui"]):focus,select:not([class^="weui"]):focus,textarea:not([class^="weui"]):focus{box-shadow:inset 0 0 0 1.5px var(--acc)}
.row{display:flex;gap:10px;margin-bottom:10px}
.row>div{flex:1;min-width:0}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{color:var(--tx3);font-weight:400;text-align:left;padding:6px;border-bottom:.5px solid var(--line);font-size:12px;white-space:nowrap}
tbody td{padding:8px 6px;border-bottom:.5px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:active{background:var(--surf2)}
td.r,th.r{text-align:right}
.tw{overflow-x:auto;margin:0 -6px}

.box{border-radius:var(--r2);padding:10px 12px;font-size:13px;line-height:1.65;margin-top:10px;background:var(--surf2);color:var(--tx2)}
.box b{display:block;margin-bottom:2px;font-size:13.5px;color:var(--tx)}
.box em{font-style:normal;font-weight:600;color:var(--tx)}
.box.warn{background:var(--tagO)}.box.bad{background:var(--tagR)}.box.good{background:var(--tagG)}
.box.info{background:var(--tagB)}.box.dim{background:var(--surf2)}

.empty{text-align:center;color:var(--tx3);padding:40px 16px;line-height:1.8}
.empty b{display:block;color:var(--tx2);font-size:15px;margin-bottom:4px}
.skel{background:linear-gradient(90deg,var(--surf2) 25%,var(--line) 37%,var(--surf2) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--r2)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* 折叠：卡片里的小折叠 + 整张可折叠的卡片 */
details.fold{border-top:.5px solid var(--line);margin-top:10px}
details.fold>summary{cursor:pointer;font-size:14px;color:var(--tx);padding:10px 0 9px;list-style:none;display:flex;align-items:center;gap:6px}
details.fold>summary::-webkit-details-marker,details.cfold>summary::-webkit-details-marker{display:none}
details.fold>summary::after,details.cfold>summary::after{content:"";margin-left:auto;width:7px;height:7px;flex-shrink:0;
  border-right:1.5px solid var(--tx4);border-bottom:1.5px solid var(--tx4);transform:rotate(-45deg);transition:transform .18s}
details.fold[open]>summary::after,details.cfold[open]>summary::after{transform:rotate(45deg)}
details.cfold{background:var(--surf);border-radius:var(--r);margin-bottom:12px;padding:0 16px}
details.cfold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:13px 0;font-size:15px;font-weight:600}
details.cfold>summary .t{flex:1;min-width:0}
details.cfold>summary .r{font-size:12px;font-weight:400;color:var(--tx3);text-align:right}
details.cfold>summary .r+*{margin-left:0}
details.cfold[open]{padding-bottom:14px}
details.cfold>.card{background:none;padding:0;margin:0 0 8px;border-radius:0}

/* 顶部摘要 */
.hero{background:var(--surf);border-radius:var(--r);padding:10px 16px;margin-bottom:12px}
.hrow{display:flex;align-items:center;gap:12px;padding:3px 0}
.hrow .hk{font-size:13px;color:var(--tx3);width:64px;flex-shrink:0}
.hrow .hv{font-size:15px;font-weight:600;flex:1;min-width:0}
.hero .hnote{font-size:12.5px;color:var(--tx3);margin-top:6px;padding-top:8px;border-top:.5px solid var(--line);line-height:1.6}

/* 行动条 */
.action{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;background:var(--surf)}
.action.sell{box-shadow:inset 3px 0 0 var(--up)}.action.buy{box-shadow:inset 3px 0 0 var(--dn)}.action.block{box-shadow:inset 3px 0 0 var(--warn)}
.action .ai{font-size:18px;line-height:1.35;flex-shrink:0;color:var(--tx3)}
.action.sell .ai{color:var(--up)}.action.buy .ai{color:var(--dn)}.action.block .ai{color:var(--warn)}
.action .ah{font-size:15px;font-weight:600;margin-bottom:2px}
.action .ab{font-size:13px;color:var(--tx2);line-height:1.65}
.action .ab em{color:var(--tx);font-style:normal;font-weight:600}

/* 标的列表 */
.ilist{display:grid}
.icard{padding:12px 0;cursor:pointer;position:relative;border-top:.5px solid var(--line)}
.icard:first-child{border-top:0;padding-top:2px}
.icard.sell::before,.icard.buy::before{content:"";position:absolute;left:-16px;top:14px;bottom:14px;width:3px;border-radius:0 2px 2px 0}
.icard.sell::before{background:var(--up)}.icard.buy::before{background:var(--dn)}
.ihead{display:flex;align-items:flex-start;gap:12px}
.iname{font-size:16px;font-weight:600}
.icode{font-size:12px;color:var(--tx3);margin-top:1px}
.ipx{font-size:20px;font-weight:600;text-align:right;line-height:1.15}
.ichg{font-size:13px;font-weight:500;text-align:right;margin-top:2px}
.istat{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.istat>div{font-size:12px;color:var(--tx3)}
.istat>div b{display:block;color:var(--tx);font-size:14px;font-weight:600;margin-top:1px}

/* 图表 */
.chart{position:relative;background:var(--surf2);border-radius:var(--r2);padding:10px 12px 8px;margin-bottom:10px}
.chart .ch{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.chart .ch b{font-size:13px;color:var(--tx2);font-weight:600}
.chart .ch span{font-size:11.5px;color:var(--tx4);margin-left:auto}
.chart svg{display:block;overflow:visible}
.chart .cw{position:relative}
.chart .axl{position:absolute;font-size:10px;line-height:1;color:var(--tx3);pointer-events:none;white-space:nowrap;
  background:var(--surf2);padding:1px 3px;border-radius:3px}
.chart .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--tx3);margin-top:6px}
.chart .lg i{display:inline-block;width:11px;height:2px;margin-right:5px;vertical-align:3px;border-radius:1px}
.chart .lg i.sq{height:9px;border-radius:2px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surf);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6;
  z-index:20;opacity:0;transition:opacity .1s;box-shadow:var(--shadow);white-space:nowrap}
.tip.on{opacity:1}
.tip .tt{color:var(--tx3);font-size:11px;margin-bottom:3px}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr span{color:var(--tx3)}
.tip .tr b{font-weight:600}

/* 分位条、因子条 */
.gauge{margin:6px 0 4px}
.gauge .tk{position:relative;height:30px;background:var(--surf2);border-radius:var(--r3);overflow:hidden}
.gauge .fl{position:absolute;inset:0;background:linear-gradient(90deg,var(--tagG) 0%,transparent 50%,var(--tagR) 100%)}
.gauge .gt{position:absolute;top:0;bottom:0;width:1px;background:var(--line3)}
.gauge .gt b{position:absolute;top:2px;font-size:10px;color:var(--tx3);white-space:nowrap;font-weight:400}
.gauge .pin{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px;background:var(--acc)}
.gauge .cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:5px}
.fr{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.fr .fn{width:76px;color:var(--tx2);flex-shrink:0}
.fr .fb{flex:1;height:14px;background:var(--surf2);border-radius:4px;position:relative;overflow:hidden}
.fr .fb i{position:absolute;top:0;bottom:0}
.fr .fb .md{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.fr .fv{width:44px;text-align:right;color:var(--tx2);flex-shrink:0;font-size:12px}

/* 详情页 */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--acc);font-size:14px;cursor:pointer;padding:2px 0 8px}
.dhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px;padding:0 4px}
.dhead .dname{font-size:22px;font-weight:600}
.dhead .dc{font-size:12.5px;color:var(--tx3);margin-top:2px}
.dhead .dp{margin-left:auto;text-align:right}
.dhead .dp .v{font-size:26px;font-weight:600;line-height:1.1}
.dhead .dp .c{font-size:14px;font-weight:500;margin-top:2px}

/* 提示（WeUI 文字 toast 的样子） */
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.96);z-index:600;background:rgba(17,17,17,.88);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:14px;line-height:1.5;opacity:0;pointer-events:none;transition:.18s;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ===== 光迅页 ===== */
#p-gx details.dkr{border-bottom:.5px solid var(--line)}
#p-gx details.dkr:last-of-type{border-bottom:0}
#p-gx details.dkr>summary{display:grid;grid-template-columns:minmax(84px,1.1fr) minmax(0,1.6fr) auto auto;
  align-items:center;gap:8px;padding:9px 0;font-size:13px;color:var(--tx);list-style:none;cursor:pointer}
#p-gx details.dkr>summary::-webkit-details-marker{display:none}
.dkn{color:var(--tx2)}
.dkv{font-weight:600;min-width:0;overflow-wrap:anywhere}
.dkc,.dkt{justify-self:end}
.dkd{font-size:12.5px;color:var(--tx3);line-height:1.7;padding:0 0 10px}
.dkd b{color:var(--tx2)}
@media(max-width:560px){
  #p-gx details.dkr>summary{grid-template-columns:1fr auto;row-gap:4px}
  .dkv{grid-column:1/2;grid-row:2}.dkc{grid-column:2/3;grid-row:1}.dkt{grid-column:2/3;grid-row:2}
}
.dkbar{display:inline-block;position:relative;width:120px;height:8px;border-radius:4px;vertical-align:middle;
  background:linear-gradient(90deg,var(--dn),var(--line2) 50%,var(--up))}
.dkbar i{position:absolute;top:-3px;width:3px;height:14px;margin-left:-1px;border-radius:2px;background:var(--tx)}
.lvbox{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.lvbox>div{background:var(--surf2);border-radius:var(--r2);padding:10px 8px 8px;text-align:center;min-width:0}
.lvbox span{display:block;font-size:12px;color:var(--tx3)}
.lvbox b{display:block;font-size:24px;font-weight:600;margin:2px 0 1px;line-height:1.25}
.lvbox i{display:block;font-style:normal;font-size:11.5px;color:var(--tx3);overflow-wrap:anywhere}
.lvbox em{display:block;font-style:normal;font-size:11.5px;margin-top:4px;color:var(--warn);font-weight:600}
.lvbox em.m{color:var(--tx4);font-weight:400}
.lvbox .lva b{font-size:16px;color:var(--tx2)}
.lvbox .lva{max-width:104px}
@media(max-width:420px){.lvbox b{font-size:21px}.lvbox .lva{max-width:84px}}
table.lvlad td{padding:6px;font-size:12.5px}
.lvseg{display:flex;width:100%;margin-bottom:8px}
.lvseg button{flex:1;padding:6px 4px;font-size:12.5px}
table.lvlad tr.lvpick td{background:var(--tagB);font-weight:600}
table.lvlad tr.lvanc td{background:var(--surf2);color:var(--tx2)}
.dkn2{font-size:13px;line-height:1.6;padding:6px 0;border-bottom:.5px solid var(--line)}
.dkn2 a{color:var(--tx)}
.dkopen{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:.5px solid var(--line);font-size:13px}
.dkopen span{flex:1 1 180px}
.dkopen input{width:110px!important;flex:0 0 110px;padding:6px 8px!important;font-size:14px!important}
.kf{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:6px 10px;align-items:center;font-size:13px;
  padding:9px 0;border-bottom:.5px solid var(--line)}
.kf:last-of-type{border-bottom:0}
.kf .kn{color:var(--tx2)}.kf .kv{font-weight:600;overflow-wrap:anywhere}.kf .ke{justify-self:end;font-size:12.5px;white-space:nowrap}
@media(max-width:420px){.kf{grid-template-columns:1fr auto auto}.kf .kv{grid-column:1/-1;grid-row:2}}

/* ===== ETF 页：我的 ETF ===== */
.ebs{padding:12px 0}
.ebs+.ebs{border-top:.5px solid var(--line)}
.ebs:first-of-type{padding-top:2px}
.ebsh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:15px;cursor:pointer}
.ebsh b{font-weight:600}
.ebsh .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ebsh .m{font-size:12px}
.ebsh .r{flex-shrink:0;font-size:13px;color:var(--tx2);white-space:nowrap}
.ebst{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--tx2);margin-bottom:6px;line-height:1.55}
.ebrec{font-size:12.5px;color:var(--tx3);line-height:1.6;margin-bottom:2px}
.ebrec b{color:var(--tx2)}.ebrec b.up{color:var(--up)}.ebrec b.dn{color:var(--dn)}
.ebs details.fold{margin-top:6px}

/* ===== WeUI 列表放进内容区：圆角分组（inset grouped） ===== */
.wrap .weui-cells{border-radius:var(--r);overflow:hidden;margin-top:6px}
.wrap .weui-cells:before,.wrap .weui-cells:after{display:none}
.wrap .weui-cells__title{margin-top:18px;padding:0 4px;font-size:13px}
.wrap .weui-cells__title:first-child{margin-top:4px}
.wrap .weui-cells__tips{padding:6px 4px 0;font-size:12.5px;line-height:1.6;color:var(--tx3)}
.wrap .weui-cell{font-size:15px}
.wrap .weui-cell__ft{font-size:14px}
.wrap .weui-cells .btn{margin-left:8px}
.wrap .weui-label{width:7em}
.cellbtns{display:flex;gap:8px;flex-wrap:wrap;padding:12px 4px 0}
</style>

<body>
<div class="app">

<div class="topbar">
  <div class="tt"><h2 id="ttl">我的 ETF</h2><div class="st" id="navFoot">加载中…</div></div>

    <p class="weui-tabbar__label">设置</p>
  </button>
</div>

</div>
<div id="toast"></div>
<script>
/* ============================================================
   隔日T引擎 v3 —— 针对「股票+ETF混合持仓」重建
   与之前股票版的差异：
   1. 成本按品种分：ETF 免印花税免过户费，最小变动价位 0.001；股票反之
   2. 标准化窗口自适应：新上市标的历史短，用可得的最长窗口（下限40天）
   3. 因子权重不照搬股票版，在 ETF 池上重新验证后再定
   无未来函数：因子只用截至当日收盘；标准化与百分位窗口只含当日之前。
   ============================================================ */
var SW = (function () {
  "use strict";

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function sq(x, s) { if (!isFinite(x) || !s) return 0; return clamp(100 * Math.tanh(x / s), -100, 100); }
  function mean(a) { var s = 0, n = 0, i; for (i = 0; i < a.length; i++) if (isFinite(a[i])) { s += a[i]; n++; } return n ? s / n : 0; }
  function stdev(a) { var b = a.filter(isFinite); if (b.length < 2) return 0; var m = mean(b), s = 0, i; for (i = 0; i < b.length; i++) s += (b[i] - m) * (b[i] - m); return Math.sqrt(s / (b.length - 1)); }
  function median(a) { var b = a.filter(isFinite).slice().sort(function (x, y) { return x - y; }); if (!b.length) return 0; var h = b.length >> 1; return b.length % 2 ? b[h] : (b[h - 1] + b[h]) / 2; }
  function pctRank(arr, v) { var n = arr.length; if (!n) return 50; var c = 0, i; for (i = 0; i < n; i++) if (arr[i] <= v) c++; return c / n * 100; }
  function wilson(k, n) {
    if (!n) return [0, 0];
    var z = 1.96, p = k / n, d = 1 + z * z / n, c = p + z * z / (2 * n);
    var m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
    return [clamp((c - m) / d * 100, 0, 100), clamp((c + m) / d * 100, 0, 100)];
  }
  function tOf(a) { var b = a.filter(isFinite); if (b.length < 3) return 0; var s = stdev(b); return s > 0 ? mean(b) / (s / Math.sqrt(b.length)) : 0; }
  function rankify(a) {
    var ix = a.map(function (v, i) { return [v, i]; });
    ix.sort(function (x, y) { return x[0] - y[0]; });
    var r = new Array(a.length), i = 0;
    while (i < ix.length) {
      var j = i; while (j + 1 < ix.length && ix[j + 1][0] === ix[i][0]) j++;
      var av = (i + j) / 2 + 1;
      for (var k = i; k <= j; k++) r[ix[k][1]] = av;
      i = j + 1;
    }
    return r;
  }
  function pearson(xs, ys) {
    var n = xs.length; if (n < 8) return NaN;
    var mx = mean(xs), my = mean(ys), sx = 0, sy = 0, sxy = 0, i;
    for (i = 0; i < n; i++) { var a = xs[i] - mx, b = ys[i] - my; sx += a * a; sy += b * b; sxy += a * b; }
    return (sx > 0 && sy > 0) ? sxy / Math.sqrt(sx * sy) : NaN;
  }
  function spearman(x, y) { return pearson(rankify(x), rankify(y)); }

  function parseK(arr) {
    return arr.map(function (s) {
      var a = s.split(",");
      return { d: a[0], o: +a[1], c: +a[2], h: +a[3], l: +a[4], vol: +a[5], amt: +a[6],
        amp: +a[7], pct: +a[8], chg: +a[9], turn: +a[10] };
    });
  }

  /* ---------------- 成本 ---------------- */
  function tickOf(kind) { return kind === "etf" ? 0.001 : 0.01; }
  function costOf(px, kind, F) {
    var notional = F.notional > 0 ? F.notional : 50000;
    var comm = Math.max(notional * (F.commRate || 0) / 1e4, F.commMin || 0);
    var commBp = comm / notional * 1e4 * 2;
    var stampBp = kind === "etf" ? 0 : (F.stamp == null ? 0.05 : F.stamp) * 100;
    var transBp = kind === "etf" ? 0 : (F.trans == null ? 0.001 : F.trans) * 100 * 2;
    var tickBp = px > 0 ? tickOf(kind) / px * 1e4 : 0;
    var slipBp = tickBp * (F.slipTicks == null ? 1 : F.slipTicks);
    return { commBp: commBp, stampBp: stampBp, transBp: transBp, tickBp: tickBp,
      slipBp: slipBp, total: commBp + stampBp + transBp + slipBp };
  }

  /* ---------------- 因子 ---------------- */
  var FACTORS = [
    { k: "day1", label: "当日涨跌", desc: "今日涨跌幅÷ATR" },
    { k: "rs", label: "相对基准", desc: "今日涨跌 − 基准指数涨跌，÷ATR" },
    { k: "run", label: "连涨连跌", desc: "连续同向天数" },
    { k: "lv", label: "量比", desc: "今日量÷近20日中位量，取对数" },
    { k: "bias5", label: "5日乖离", desc: "距5日均线距离÷ATR" },
    { k: "amp", label: "振幅", desc: "今日振幅÷ATR" },
    { k: "gap", label: "跳空", desc: "开盘跳空÷ATR" },
    { k: "pos20", label: "20日位置", desc: "在近20日区间中的位置" },
    { k: "vol5", label: "5日波动", desc: "近5日收益标准差÷ATR" },
    { k: "accel", label: "动量加速度", desc: "近2日涨幅 − 前3日涨幅" },
    { k: "vTrend", label: "量能趋势", desc: "近3日均量÷近10日均量" },
    { k: "revsp", label: "回补速度", desc: "今日把昨日波动回补了多少" }
  ];

  function factorsAt(daily, i, benchPct) {
    if (i < 25) return null;
    /* 收盘价数组缓存在 daily 上（以前每根K都重建一遍，整条序列是 O(n²)，手机上很卡）。daily 一旦生成就不再修改。 */
    var c = (daily._c && daily._c.length === daily.length) ? daily._c : (daily._c = daily.map(function (x) { return x.c; }));
    var px = c[i];
    var trs = [], j;
    for (j = i - 13; j <= i; j++) {
      trs.push(Math.max(daily[j].h - daily[j].l,
        Math.abs(daily[j].h - c[j - 1]), Math.abs(daily[j].l - c[j - 1])));
    }
    var atr = mean(trs) / px * 100;
    if (!(atr > 0)) return null;
    var ma5 = mean(c.slice(i - 4, i + 1));
    var vols = daily.slice(i - 19, i + 1).map(function (x) { return x.vol; });
    var medV = median(vols);
    var hi20 = Math.max.apply(null, daily.slice(i - 19, i + 1).map(function (x) { return x.h; }));
    var lo20 = Math.min.apply(null, daily.slice(i - 19, i + 1).map(function (x) { return x.l; }));
    var run = 0;
    for (j = i; j > 0 && j > i - 8; j--) {
      var up = c[j] > c[j - 1];
      if (j === i) run = up ? 1 : -1;
      else if ((up && run > 0) || (!up && run < 0)) run += up ? 1 : -1;
      else break;
    }
    var r5 = [];
    for (j = i - 4; j <= i; j++) r5.push((c[j] / c[j - 1] - 1) * 100);
    var bp = benchPct ? (benchPct[daily[i].d] || 0) : 0;
    var v3 = mean(daily.slice(i - 2, i + 1).map(function (x) { return x.vol; }));
    var v10 = mean(daily.slice(i - 9, i + 1).map(function (x) { return x.vol; }));
    var prevRange = (daily[i - 1].h - daily[i - 1].l) / c[i - 1] * 100;

    return {
      day1: daily[i].pct / atr,
      rs: (daily[i].pct - bp) / atr,
      run: run,
      lv: medV > 0 ? Math.log(daily[i].vol / medV) : 0,
      bias5: (px / ma5 - 1) * 100 / atr,
      amp: ((daily[i].h - daily[i].l) / px * 100) / atr,
      gap: (daily[i].o / c[i - 1] - 1) * 100 / atr,
      pos20: hi20 > lo20 ? (px - lo20) / (hi20 - lo20) : 0.5,
      vol5: stdev(r5) / atr,
      accel: ((c[i] / c[i - 2] - 1) - (c[i - 2] / c[i - 5] - 1)) * 100 / atr,
      vTrend: v10 > 0 ? Math.log(v3 / v10) : 0,
      revsp: prevRange > 0 ? (daily[i].pct / prevRange) : 0,
      _atr: atr, _px: px
    };
  }

  /* ---------------- 序列：滚动标准化 + 合成 + 滚动百分位 ---------------- */
  function buildSeries(daily, benchPct, P) {
    var raw = [], i;
    for (i = 0; i < daily.length; i++) {
      var f = factorsAt(daily, i, benchPct);
      raw.push(f ? { i: i, d: daily[i].d, f: f } : null);
    }
    var keys = FACTORS.filter(function (x) { return Math.abs(P.w[x.k] || 0) > 0; }).map(function (x) { return x.k; });
    /* 没有任何因子有权重时，合成分恒为0，百分位会退化成「每天都触发」。
       这是个会把行情涨跌伪装成信号的陷阱，直接拒绝出信号。 */
    if (!keys.length) return raw.map(function () { return null; });
    var out = [], hist = [], scores = [];
    for (i = 0; i < raw.length; i++) {
      if (!raw[i]) { out.push(null); continue; }
      hist.push(raw[i]);
      var minW = P.minWin || 40;
      if (hist.length <= minW) { out.push(null); continue; }
      var win = hist.slice(Math.max(0, hist.length - 1 - P.normWin), hist.length - 1);
      var s = 0, wsum = 0, zs = {};
      keys.forEach(function (k) {
        var col = win.map(function (r) { return r.f[k]; });
        var m = mean(col), sd = stdev(col) || 1;
        var z = clamp((raw[i].f[k] - m) / sd, -4, 4);
        zs[k] = z;
        var w = P.w[k] || 0;
        s += w * z; wsum += Math.abs(w);
      });
      var score = wsum > 0 ? s / wsum : 0;
      var pw = scores.filter(function (v) { return v != null; });
      pw = pw.slice(Math.max(0, pw.length - P.pctWin));
      /* 窗口里分数全相同（退化）时不给百分位，否则会把常数误判成极端值 */
      var pct = (pw.length >= 30 && stdev(pw) > 1e-9) ? pctRank(pw, score) : 50;
      out.push({ i: raw[i].i, d: raw[i].d, f: raw[i].f, z: zs, score: score, pct: pct });
      scores.push(score);
    }
    return out;
  }

  /* ---------------- 市场状态门控 ----------------
     只用大盘指数算：当日涨跌(ATR归一) + 成交额放缩。
     规则：大盘上涨日只允许倒T(高抛)，大盘下跌日只允许正T(低吸)。
     实证：不门控 +20.4bp(t=1.89) → 加门控 +36.9bp(t=3.28)，5个切分点全部改善；
           其中「正T在大盘上涨日做」是显著亏钱的 -123.7bp(t=-3.1)。 */
  function marketState(benchDaily) {
    var out = {};
    if (!benchDaily || benchDaily.length < 30) return out;
    var c = benchDaily.map(function (x) { return x.c; });
    for (var i = 25; i < benchDaily.length; i++) {
      var trs = [], j;
      for (j = i - 13; j <= i; j++) {
        trs.push(Math.max(benchDaily[j].h - benchDaily[j].l,
          Math.abs(benchDaily[j].h - c[j - 1]), Math.abs(benchDaily[j].l - c[j - 1])));
      }
      var atr = mean(trs) / c[i] * 100;
      if (!(atr > 0)) continue;
      var amt20 = median(benchDaily.slice(i - 19, i + 1).map(function (x) { return x.amt; }));
      var ret = benchDaily[i].pct / atr;
      var amt = amt20 > 0 ? Math.log(benchDaily[i].amt / amt20) : 0;
      out[benchDaily[i].d] = {
        ret: ret, amt: amt,
        panic: -ret * 0.6 + amt * 0.4,
        calm: ret > 0            /* 大盘上涨=平静，允许倒T */
      };
    }
    return out;
  }
  /* 这一天允许哪个方向：+1 只倒T / -1 只正T / 0 数据缺失时不限制 */
  function allowedDir(mkt, d) {
    var m = mkt && mkt[d];
    if (!m) return 0;
    return m.calm ? 1 : -1;
  }

  /* ---------------- 回测 ---------------- */
  function backtest(series, daily, P, F, kind, opt) {
    opt = opt || {};
    var trades = [], lastExit = -999, i;
    var MK = opt.mkt || null;
    for (i = 0; i < series.length; i++) {
      var s = series[i];
      if (!s) continue;
      var di = s.i;
      if (di + P.holdDays > daily.length - 1) continue;   /* 出场那根K必须已经存在 */
      if (opt.from && daily[di].d < opt.from) continue;
      if (opt.to && daily[di].d > opt.to) continue;
      if (di - lastExit < P.cooldown) continue;
      var dir = 0;
      if (s.pct >= 100 - P.qSell) dir = 1;
      else if (s.pct <= P.qBuy) dir = -1;
      if (!dir) continue;
      if (P.dirMode && P.dirMode !== dir) continue;
      if (P.useGate && MK) {
        var ad = allowedDir(MK, daily[di].d);
        if (ad !== 0 && ad !== dir) continue;
      }

      /* 执行模式：同一个信号（收盘T出），三种成交方式
         full = 收盘T进、收盘T+1出（扛一夜 + 走一个日内段）
         gap  = 收盘T进、开盘T+1出（只扛一夜；跳空没法止损，所以不设止损）
         day  = 开盘T+1进、收盘T+1出（完全不隔夜；盘中连续，止损能成交） */
      var mode = P.mode || "full";
      var nd0 = daily[di + 1];
      if (mode !== "full" && !nd0) continue;
      var entry = (mode === "day") ? nd0.o : daily[di].c;
      if (!(entry > 0)) continue;
      var cost = costOf(entry, kind, F).total;
      if (P.minRatio > 0) {
        var rr = [], z;
        for (z = Math.max(1, di - 39); z <= di; z++) rr.push((daily[z].h - daily[z].l) / daily[z].c * 1e4);
        if (median(rr) / cost < P.minRatio) continue;
      }
      var atrBp = s.f._atr * 100;
      var stopBp = P.stopMul > 0 ? P.stopMul * atrBp : 0;
      var got = null, why = "", days = 0, k;
      if (mode === "gap") {
        got = dir > 0 ? (entry / nd0.o - 1) * 1e4 : (nd0.o / entry - 1) * 1e4;
        why = "次日开盘"; days = 1;
      } else if (mode === "day") {
        /* 开盘就涨停（买）/ 跌停（卖）：进场单成交不了，这笔不存在 */
        var og = (nd0.o / daily[di].c - 1) * 100;
        if ((dir < 0 && og >= 9.7) || (dir > 0 && og <= -9.7)) { got = null; }
        else {
          var adv1 = dir > 0 ? (nd0.h / entry - 1) * 1e4 : (entry / nd0.l - 1) * 1e4;
          var ret1 = dir > 0 ? (entry / nd0.c - 1) * 1e4 : (nd0.c / entry - 1) * 1e4;
          if (stopBp > 0 && adv1 >= stopBp) { got = -stopBp; why = "止损"; }
          else { got = ret1; why = "当日收盘"; }
        }
        days = 1;
      } else {
        for (k = 1; k <= P.holdDays; k++) {
          var nd = daily[di + k];
          if (!nd) break;
          days = k;
          var adverse = dir > 0 ? (nd.h / entry - 1) * 1e4 : (entry / nd.l - 1) * 1e4;
          var ret = dir > 0 ? (entry / nd.c - 1) * 1e4 : (nd.c / entry - 1) * 1e4;
          /* 开盘就已经越过止损位：止损单只能按开盘价成交，亏得比止损价多。
             旧版一律按止损价算，是个乐观假设（个股 0.5ATR 紧止损受影响最大）。 */
          var gapAdv = dir > 0 ? (nd.o / entry - 1) * 1e4 : (entry / nd.o - 1) * 1e4;
          if (stopBp > 0 && gapAdv >= stopBp) { got = -gapAdv; why = "跳空止损"; break; }
          if (stopBp > 0 && adverse >= stopBp) { got = -stopBp; why = "止损"; break; }
          if (k === P.holdDays) { got = ret; why = "到期"; }
        }
      }
      if (got == null) continue;
      trades.push({
        d: daily[di].d, exitD: daily[di + days] ? daily[di + days].d : "",
        dir: dir, entry: entry, gross: got, cost: cost, net: got - cost,
        days: days, why: why, pct: s.pct, score: s.score, code: opt.code || ""
      });
      lastExit = di + days;
    }
    return trades;
  }

  function stats(trades) {
    var n = trades.length;
    var nets = trades.map(function (t) { return t.net; });
    var wins = nets.filter(function (v) { return v > 0; }).length;
    var m = mean(nets), sd = stdev(nets);
    var gw = 0, gl = 0, wn = 0, ln = 0, cum = 0, peak = 0, mdd = 0, curve = [0];
    var byDir = {}, byWhy = {};
    trades.forEach(function (t) {
      if (t.net > 0) { gw += t.net; wn++; } else { gl -= t.net; ln++; }
      cum += t.net; curve.push(cum);
      if (cum > peak) peak = cum;
      if (peak - cum > mdd) mdd = peak - cum;
      var add = function (o, k) { o[k] = o[k] || { n: 0, w: 0, net: 0 }; o[k].n++; if (t.net > 0) o[k].w++; o[k].net += t.net; };
      add(byDir, t.dir > 0 ? "倒T" : "正T"); add(byWhy, t.why);
    });
    var need = (m !== 0 && sd > 0) ? Math.ceil(Math.pow(2 * sd / Math.abs(m), 2)) : 99999;
    /* t 值按「交易日」聚类：同一天的多笔交易同涨同跌，不能当成独立样本。
       旧版逐笔算 t，在 ETF 池上把显著性夸大了一倍多（3.94 → 1.67）。 */
    var eg = {}, G = 0, ss = 0, tc = 0;
    trades.forEach(function (t) { eg[t.d] = (eg[t.d] || 0) + (t.net - m); });
    Object.keys(eg).forEach(function (k) { G++; ss += eg[k] * eg[k]; });
    if (G > 2 && ss > 0) tc = m / Math.sqrt((G / (G - 1)) * ss / (n * n));
    return {
      trades: trades, n: n, win: n ? wins / n * 100 : 0, winCI: wilson(wins, n),
      mean: m, sd: sd, t: tc, tNaive: tOf(nets), days: G, total: m * n, mdd: mdd, curve: curve,
      pf: gl > 0 ? gw / gl : (gw > 0 ? 99 : 0),
      payoff: (wn && ln && gl > 0) ? (gw / wn) / (gl / ln) : 0,
      avgCost: n ? mean(trades.map(function (x) { return x.cost; })) : 0,
      avgGross: n ? mean(trades.map(function (x) { return x.gross; })) : 0,
      byDir: byDir, byWhy: byWhy, needN: need
    };
  }

  function defaultP() {
    var w = {};
    FACTORS.forEach(function (f) { w[f.k] = 0; });
    w.day1 = 100; w.rs = 100; w.run = 80; w.lv = 80; w.bias5 = 60; w.amp = 50; w.gap = 50;
    return {
      w: w, normWin: 120, pctWin: 120, minWin: 40,
      qSell: 10, qBuy: 10, holdDays: 1, cooldown: 1,
      stopMul: 1.5, dirMode: 0, minRatio: 8, useGate: 1
    };
  }
  function defaultF() {
    return { notional: 50000, commRate: 1, commMin: 5, stamp: 0.05, trans: 0.001, slipTicks: 0.5 };
  }

  return {
    parseK: parseK, costOf: costOf, tickOf: tickOf, factorsAt: factorsAt,
    buildSeries: buildSeries, backtest: backtest, stats: stats,
    marketState: marketState, allowedDir: allowedDir,
    defaultP: defaultP, defaultF: defaultF, FACTORS: FACTORS,
    mean: mean, stdev: stdev, median: median, spearman: spearman, tOf: tOf,
    wilson: wilson, rankify: rankify, clamp: clamp, pctRank: pctRank
  };
})();

</script>
<script>
var SNAP = null;
</script>
<script>
var NETCACHE = null;
</script>
<script>
/* 交互式 SVG 图表 —— 无外部依赖，带十字光标与悬浮数据 */
var CH = (function () {
  "use strict";
  var uid = 0;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
  function fx(v, d) { return (v == null || !isFinite(v)) ? "—" : v.toFixed(d == null ? 2 : d); }
  function mn(a) { return Math.min.apply(null, a); }
  function mx(a) { return Math.max.apply(null, a); }
  /* 刻度标签：绝对定位的 HTML，不受 SVG 横向拉伸影响。
     above=true 时贴在 y 上方，否则贴在下方。 */
  function axl(txt, y, above, side) {
    return '<div class="axl" style="' + (side === "left" ? "left:2px" : "right:2px") +
      ';top:' + (y + (above ? -3 : 3)).toFixed(1) + 'px' +
      (above ? ';transform:translateY(-100%)' : '') + '">' + esc(txt) + '</div>';
  }

  /* 给容器挂上十字光标交互。getHTML(i) 返回 tooltip 内容 */
  function bind(host, n, pad, getHTML, onIdx) {
    var svg = host.querySelector("svg");
    var tip = host.querySelector(".tip");
    var cx = host.querySelector(".cx");
    if (!svg || !n) return;
    function move(ev) {
      var r = svg.getBoundingClientRect();
      var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      var f = (x - pad.l * r.width / pad.W) / ((pad.W - pad.l - pad.r) * r.width / pad.W);
      var i = Math.round(f * (n - 1));
      if (i < 0) i = 0; if (i > n - 1) i = n - 1;
      var px = pad.l + (n > 1 ? i / (n - 1) : .5) * (pad.W - pad.l - pad.r);
      if (cx) { cx.setAttribute("x1", px); cx.setAttribute("x2", px); cx.style.opacity = 1; }
      if (tip) {
        tip.innerHTML = getHTML(i);
        tip.classList.add("on");
        var rel = px / pad.W * r.width;
        var tw = tip.offsetWidth || 150;
        var left = rel + 14;
        if (left + tw > r.width) left = rel - tw - 14;
        if (left < 0) left = 4;
        tip.style.left = left + "px";
        tip.style.top = "34px";
      }
      if (onIdx) onIdx(i);
    }
    function leave() {
      if (cx) cx.style.opacity = 0;
      if (tip) tip.classList.remove("on");
      if (onIdx) onIdx(-1);
    }
    svg.addEventListener("mousemove", move);
    svg.addEventListener("mouseleave", leave);
    svg.addEventListener("touchstart", move, { passive: true });
    svg.addEventListener("touchmove", move, { passive: true });
    svg.addEventListener("touchend", leave);
  }

  /* ---------- 日线K线 + 均线 + 信号标记 + 分数副图 ---------- */
  function candles(daily, opt) {
    opt = opt || {};
    var n = opt.bars || 90;
    var off = Math.max(0, daily.length - n);
    var d = daily.slice(off);
    if (d.length < 5) return { html: "", bind: function () { } };
    var W = 900, H = opt.h || 230, SH = opt.scoreH == null ? 62 : opt.scoreH;
    var PT = 10, PB = 16, PL = 4, PR = 6, GAP = 12;
    var lo = mn(d.map(function (x) { return x.l; })), hi = mx(d.map(function (x) { return x.h; }));
    var ma5 = opt.ma5 || [], ma20 = opt.ma20 || [];
    ma5.concat(ma20).forEach(function (v) { if (isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } });
    var padv = (hi - lo) * 0.07 || 1; lo -= padv; hi += padv;
    var CW = (W - PL - PR) / d.length, bw = Math.max(1.5, Math.min(9, CW * 0.6));
    function X(i) { return PL + i * CW + CW / 2; }
    function Y(v) { return PT + (hi - v) / (hi - lo) * (H - PT - PB); }
    var id = "c" + (++uid);
    var s = '<svg viewBox="0 0 ' + W + ' ' + (H + GAP + SH) + '" preserveAspectRatio="none" ' +
      'style="width:100%;height:' + (H + GAP + SH) + 'px">';
    /* 横向网格；价格刻度放到 HTML 覆盖层 */
    var lab = "";
    [0, .25, .5, .75, 1].forEach(function (f) {
      var y = PT + f * (H - PT - PB);
      var v = hi - f * (hi - lo);
      s += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) +
        '" style="stroke:var(--line)" stroke-width="1"' + (f === 0 || f === 1 ? '' : ' stroke-dasharray="2 5"') + '/>';
      lab += axl(fx(v, v > 100 ? 1 : 3), y, f === 1);
    });
    /* K线 */
    d.forEach(function (b, i) {
      var up = b.c >= b.o, col = up ? "#ff4d5e" : "#16c784", x = X(i);
      s += '<line x1="' + x.toFixed(1) + '" y1="' + Y(b.h).toFixed(1) + '" x2="' + x.toFixed(1) +
        '" y2="' + Y(b.l).toFixed(1) + '" stroke="' + col + '" stroke-width="1"/>';
      var y1 = Y(Math.max(b.o, b.c)), y2 = Y(Math.min(b.o, b.c));
      s += '<rect x="' + (x - bw / 2).toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + Math.max(1, y2 - y1).toFixed(1) + '" fill="' + col + '"/>';
    });
    function poly(arr, col) {
      var pts = [];
      arr.forEach(function (v, i) { if (isFinite(v)) pts.push(X(i).toFixed(1) + "," + Y(v).toFixed(1)); });
      return pts.length > 1 ? '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + col +
        '" stroke-width="1.3" stroke-linejoin="round" opacity=".92"/>' : "";
    }
    s += poly(ma5, "#f5a524") + poly(ma20, "#5b8cff");
    /* 信号标记 */
    (opt.marks || []).forEach(function (m) {
      if (m.i < 0 || m.i >= d.length) return;
      var x = X(m.i), sell = m.dir > 0;
      var y = sell ? Y(d[m.i].h) - 9 : Y(d[m.i].l) + 9;
      var col = sell ? "#ff4d5e" : "#16c784";
      var tri = sell ? (x - 4.5) + "," + (y - 1) + " " + (x + 4.5) + "," + (y - 1) + " " + x + "," + (y + 5.5)
        : (x - 4.5) + "," + (y + 1) + " " + (x + 4.5) + "," + (y + 1) + " " + x + "," + (y - 5.5);
      s += '<polygon points="' + tri + '" fill="' + col + '"/>';
    });
    /* 最新价虚线 */
    var lc = d[d.length - 1].c;
    s += '<line x1="' + PL + '" y1="' + Y(lc).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + Y(lc).toFixed(1) +
      '" style="stroke:var(--tx3)" stroke-width="1" stroke-dasharray="4 4" opacity=".45"/>';
    /* 分数副图 */
    var sc = (opt.scores || []).slice(Math.max(0, (opt.scores || []).length - d.length));
    if (SH && sc.length) {
      var y0 = H + GAP, mid = y0 + SH / 2;
      var vals = sc.filter(function (v) { return v != null && isFinite(v); });
      var smx = vals.length ? Math.max(.5, mx(vals.map(Math.abs))) : 1;
      s += '<rect x="' + PL + '" y="' + y0 + '" width="' + (W - PL - PR) + '" height="' + SH +
        '" style="fill:var(--bg)" rx="4"/>';
      s += '<line x1="' + PL + '" y1="' + mid + '" x2="' + (W - PR) + '" y2="' + mid +
        '" style="stroke:var(--line2)" stroke-width="1"/>';
      sc.forEach(function (v, i) {
        if (v == null || !isFinite(v)) return;
        var h2 = Math.abs(v) / smx * (SH / 2 - 3);
        s += '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + (v >= 0 ? mid - h2 : mid).toFixed(1) +
          '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h2).toFixed(1) +
          '" fill="' + (v >= 0 ? "#ff4d5e" : "#16c784") + '" opacity=".7"/>';
      });
      lab += axl("合成分", y0 + 12, false, "left");
    }
    s += '<line class="cx" x1="0" y1="0" x2="0" y2="' + (H + GAP + SH) +
      '" style="stroke:var(--tx3)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
    s += '</svg>';
    var html = '<div class="chart" id="' + id + '"><div class="ch"><b>' + esc(opt.title || "日线") +
      '</b><span>' + esc(d[0].d) + " ~ " + esc(d[d.length - 1].d) + '</span></div>' +
      '<div class="cw">' + s + lab + '</div>' +
      '<div class="tip"></div><div class="lg">' +
      '<span><i style="background:#f5a524"></i>MA5</span>' +
      '<span><i style="background:#5b8cff"></i>MA20</span>' +
      (opt.lgSell === "" ? "" : '<span><i class="sq" style="background:#ff4d5e"></i>▼ ' +
        esc(opt.lgSell || "倒T触发") + '</span>') +
      '<span><i class="sq" style="background:#16c784"></i>▲ ' + esc(opt.lgBuy || "正T触发") + '</span></div></div>';
    return {
      html: html,
      bind: function () {
        var host = document.getElementById(id);
        if (!host) return;
        bind(host, d.length, { W: W, l: PL, r: PR }, function (i) {
          var b = d[i], sv = sc[i];
          var pct = b.pct != null ? b.pct : 0;
          return '<div class="tt">' + esc(b.d) + '</div>' +
            '<div class="tr"><span>收</span><b class="' + (pct >= 0 ? "up" : "dn") + '">' + fx(b.c, 2) + '</b></div>' +
            '<div class="tr"><span>涨跌</span><b class="' + (pct >= 0 ? "up" : "dn") + '">' +
            (pct >= 0 ? "+" : "") + fx(pct, 2) + '%</b></div>' +
            '<div class="tr"><span>高/低</span><b>' + fx(b.h, 2) + " / " + fx(b.l, 2) + '</b></div>' +
            (sv != null && isFinite(sv) ? '<div class="tr"><span>合成分</span><b>' + fx(sv, 2) + '</b></div>' : "");
        });
      }
    };
  }

  /* ---------- 资金曲线 ---------- */
  function equity(trades, opt) {
    opt = opt || {};
    if (!trades || trades.length < 2) return { html: "", bind: function () { } };
    var cum = 0, pts = [{ v: 0, t: null }];
    trades.forEach(function (t) { cum += t.net; pts.push({ v: cum, t: t }); });
    var W = 900, H = 170, PT = 10, PB = 14, PL = 4, PR = 6;
    var vs = pts.map(function (p) { return p.v; });
    var lo = mn(vs), hi = mx(vs);
    if (hi - lo < 1) hi = lo + 1;
    var pad = (hi - lo) * .08; lo -= pad; hi += pad;
    function X(i) { return PL + i / (pts.length - 1) * (W - PL - PR); }
    function Y(v) { return PT + (hi - v) / (hi - lo) * (H - PT - PB); }
    var col = cum >= 0 ? "#ff4d5e" : "#16c784";   /* A股习惯：盈利用红 */
    var id = "e" + (++uid);
    var line = pts.map(function (p, i) { return X(i).toFixed(1) + "," + Y(p.v).toFixed(1); });
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px">';
    s += '<defs><linearGradient id="g' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + col + '" stop-opacity=".3"/>' +
      '<stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>';

    '19 只 ETF 同涨同跌，一天里常常同时触发四五只。我逐笔算 t 值，等于把一次观测数了四五遍。' +
    '旧样本上 ETF 的 t 值：逐笔算 <em>3.94</em>，按交易日聚类后 <em>1.67</em>——<em>从来就没显著过</em>。' +
    '这个错误贯穿了之前所有的「显著」结论。</div>' +
    '<div class="box dim"><b>② 只有一段行情</b>' +
    '全部结论来自 2026 年 2~9 月。v1 的 ETF 规则分年看：2024 年 −43.1bp、2025 年 −2.8bp、2026 年 +20.4bp。' +
    '我在「研究」页写过这个局限，但还是给了具体的 bp 数字让它看起来可用。</div>' +
    '<div class="box dim"><b>③ 止损成交的乐观假设</b>' +
    '回测里止损一律按止损价成交。可如果第二天直接跳空越过止损位，实际只能按开盘价出。' +
    '修正后个股在前向段从 −81.8bp 变成 −140.8bp。引擎已改。</div>' +
    '<div class="box dim"><b>④ 看完数据再挑，然后当成发现</b>' +
    '10-14 那次「把隔夜收益拆成两段」得出的结论，在没见过的数据里方向相反（个股隔夜段 +30bp → −169bp）。' +
    '这次我又挑出一个「当日 + 避开拥挤日」的组合（+28.9bp，t=2.78），换 36 只没用过的 ETF 一测只剩 +11.1bp（t=1.64）。' +
    '<em>事后挑出来的东西，默认要打四折。</em></div></div>' +

    '<div class="card"><h3>三年证据：执行方式 × 方向<span class="r">55 只 ETF · 5385 笔 / 632 天</span></h3>' + evGrid() +
    '<div class="box info"><b>唯一真正显著的发现：隔夜段跟反转对着干</b>' +
    '超卖后收盘买入，隔夜段 <em>−27.9bp，t=−3.64，胜率 26%</em>；在原 19 只和新取的 36 只上分别是 −28.9（t=−2.44）和 −26.5（t=−2.69），两组都显著。' +
    '也就是说：大跌日收盘去抄底，四次里有三次第二天开得更低。v1 恰恰是在收盘进场。</div>' +
    '<div class="box warn"><b>候选规则 = 上面第一行</b>' +
    '等隔夜那一下走完，<em>次日开盘</em>再买、收盘卖。三组互不重叠的标的：原 19 只 ETF +25.2bp（t=1.52）、' +
    '新 36 只 ETF +24.0bp（t=2.42）、159 只个股 +26.3bp（t=2.11）。大盘门控有用：大盘上涨日的超卖信号是 −15.4bp。</div>' +
    '<div class="tw" style="margin-top:12px"><table><thead><tr><th>候选规则分年（55只ETF）</th><th class="r">笔数/天数</th>' +
    '<th class="r">每笔净bp</th><th class="r">t值</th></tr></thead><tbody>' +
    EV.years.map(function (y) { return tr([y[0], y[1] + " / " + y[2], '<span class="' + cl(y[3]) + '">' + sgn(y[3], 1) + '</span>', fx(y[4], 2)]); }).join("") +
    tr(["最近一个月（10-14 起）", EV.recent.n + " / " + EV.recent.g, '<span class="dn">' + sgn(EV.recent.bp, 1) + '</span>', "—"]) +
    '</tbody></table></div>' +
    '<div class="box bad"><b>为什么它仍然只是候选</b>' +
    '① 它是六格里挑出来的一格，t=2.1 经不起六选一的折扣；② 三组标的共用同一批交易日，不是时间上的独立重复；' +
    '③ 2024 年几乎为零；④ 最近一个月为负。' +
    '所以我没有把它叫做策略。它从 ' + FREEZE + ' 起冻结，之后的表现记在看板的前向记分牌上。</div></div>' +

    '<div class="card"><h3>v1 是怎么在一个月里被证伪的<span class="r">原 19 只 ETF · 逐日</span></h3>' +
    '<div class="tw"><table><thead><tr><th>信号日</th><th>方向 × 只数</th><th class="r">同向触发占比</th><th class="r">次日每笔bp</th></tr></thead><tbody>' +
    [["10-14", "正T × 10", "53%", -233], ["10-15", "正T × 2", "37%", 20], ["10-20", "倒T × 1", "5%", -57],
     ["10-21", "正T × 3", "16%", -369], ["10-23", "倒T × 8", "42%", 80], ["10-27", "正T × 2", "11%", 105],
     ["10-29", "正T × 4", "21%", -448], ["10-30", "正T × 1", "16%", 255], ["11-02", "倒T × 4", "21%", -74],
     ["11-04", "倒T × 16", "84%", -195], ["11-05", "倒T × 1", "32%", 213], ["11-11", "倒T × 9", "47%", 37],
     ["11-12", "正T × 1", "5%", -58], ["11-13", "正T × 1", "11%", -181]].map(function (x) {
      return tr([x[0], x[1], x[2], '<span class="' + cl(x[3]) + '">' + sgn(x[3], 0) + '</span>']);
    }).join("") + '</tbody></table></div>' +
    '<div class="sub">这一个月上证从 3800 跌到 3602（−5.2%）。下跌趋势里一路「收盘低吸」，一路被隔夜低开打脸。' +
    '10-14 那天你问我「今天会怎么 T」——你的三只当时都没触发，但池子里触发的 10 只第二天平均 −233bp。</div></div>' +

    '<div class="card"><h3>仍然成立的旧结论</h3><div class="tw"><table><thead><tr><th>结论</th><th>状态</th></tr></thead><tbody>' +
    '<tr><td>成本算术：ETF 免印花税；低价品种一跳占比高</td><td><span class="pill good">算术事实</span></td></tr>' +
    '<tr><td>5 分钟级日内做T：信号边际 2~5bp &lt; 成本 5~14bp</td><td><span class="pill good">仍然证伪</span></td></tr>' +
    '<tr><td>不拟合因子权重</td><td><span class="pill good">原则不变</span></td></tr>' +
    '<tr><td>止损对这类反转交易没有帮助</td><td><span class="pill good">三年数据同样如此</span></td></tr>' +
    '<tr><td>大盘门控的方向（逆着大盘做的那些更差）</td><td><span class="pill warn">方向一致，幅度不显著</span></td></tr>' +
    '<tr><td>倒T（高抛）</td><td><span class="pill bad">三种执行方式都不为正</span></td></tr>' +
    '</tbody></table></div></div>' +

    '<div class="card"><h3>这个工具现在承诺什么</h3><div class="sub" style="margin-top:0">' +
    '<b>不承诺能赚钱。</b>没有任何一条规则通过了严格检验。<br><br>' +
    '它现在做三件事：① 按一条写死的候选规则告诉你今天有没有待办，并且每次都把证据强度写在旁边；' +
    '② 把冻结日之后的每一笔记在前向记分牌上，让行情而不是我来判断它；' +
    '③ 把我错过的地方摊开，免得同样的错再犯一次。<br><br>' +
    '如果你要按它做：<b>小仓位</b>，把它当成一个正在做的实验。前向 20 笔后均值仍为负，就停。' +
    '</div></div>';
}

/* ---------- 设置（2026-11-23 改成 WeUI 的表单列表） ---------- */
function renderSet() {
  var ps = !NOTIF.sup ? ['bad', '不支持'] : NOTIF.perm === "granted" ? ['good', '已开启'] : NOTIF.perm === "denied" ? ['bad', '已拒绝'] : ['warn', '未开启'];
  function cell(label, ctrl, ft) {
    return '<div class="weui-cell weui-cell_active"><div class="weui-cell__hd"><label class="weui-label">' + label + '</label></div>' +
      '<div class="weui-cell__bd">' + ctrl + '</div>' + (ft ? '<div class="weui-cell__ft">' + ft + '</div>' : '') + '</div>';
  }
  function selCell(label, id, opts, val) {
    return '<div class="weui-cell weui-cell_select weui-cell_select-after"><div class="weui-cell__hd"><label class="weui-label">' + label + '</label></div>' +
      '<div class="weui-cell__bd"><select class="weui-select" id="' + id + '">' + opts.map(function (o) {
        return '<option value="' + o[0] + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join("") + '</select></div></div>';
  }
  var h = '';
  h += '<div class="weui-cells__title">提醒</div><div class="weui-cells">' +
    '<div class="weui-cell weui-cell_switch"><div class="weui-cell__bd">开盘前、收盘前提醒</div><div class="weui-cell__ft">' +
    '<input class="weui-switch" type="checkbox" id="p_alarm"' + (S.P.alarm ? ' checked' : '') + '></div></div>' +
    '<div class="weui-cell"><div class="weui-cell__bd">页面通知 <span class="pill ' + ps[0] + '">' + ps[1] + '</span></div><div class="weui-cell__ft">' +
    (NOTIF.sup && NOTIF.perm !== "granted" ? '<button class="btn sm" id="btnNotif">开启</button>'
      : (NOTIF.perm === "granted" ? '<button class="btn g sm" id="btnNotifTest">测试</button>' : '')) + '</div></div>' +
    '<div class="weui-cell"><div class="weui-cell__bd">日历提醒 09:20 · 14:48</div><div class="weui-cell__ft"><button class="btn g sm" id="btnIcs">导出</button></div></div>' +
    '</div><div class="weui-cells__tips">有待办才提醒。网页关掉后叫不醒自己，那种情况靠日历提醒：导出后用手机日历打开。' +
    (NOTIF.err ? ' <span class="m">' + esc(NOTIF.err.slice(0, 60)) + '</span>' : '') + '</div>' +
    '<textarea id="icsOut" style="display:none;margin-top:8px;height:150px;font-size:11px"></textarea>';

  h += '<div class="weui-cells__title">外观</div><div class="weui-cells">' +
    selCell("深浅色", "p_theme", [["auto", "跟随手机"], ["dark", "深色"], ["light", "浅色"]], S.P.theme || "auto") + '</div>';

  h += '<div class="weui-cells__title">我的标的</div><div class="weui-cells" id="ilist2"></div>' +
    '<div class="weui-cells">' + cell("代码", '<input class="weui-input" id="f_code" inputmode="numeric" placeholder="6 位代码，比如 563230">') +
    selCell("类型", "f_kind", [["etf", "ETF"], ["stock", "股票"]], "etf") + '</div>' +
    '<div class="cellbtns"><button class="btn" id="btnAdd">添加</button></div>' +
    '<div class="weui-cells__tips">只放 A 股 T+1 的 ETF 和股票。港股、美股、黄金、债券这类当天能卖的 ETF 检验过无效。</div>';

  h += '<div class="weui-cells__title">成本（每一笔）</div><div class="weui-cells">' +
    cell("名义金额", '<input class="weui-input" id="s_notional" type="number" step="10000" value="' + S.F.notional + '">', "元") +
    cell("佣金", '<input class="weui-input" id="s_commRate" type="number" step="0.1" value="' + S.F.commRate + '">', "万分之") +
    cell("最低佣金", '<input class="weui-input" id="s_commMin" type="number" step="0.5" value="' + S.F.commMin + '">', "元") +
    cell("滑点", '<input class="weui-input" id="s_slip" type="number" step="0.5" value="' + S.F.slipTicks + '">', "个价位") + '</div>' +
    '<details class="cfold" style="margin-top:8px"><summary><span class="t">不同价格的来回成本</span></summary><div id="costDemo"></div></details>';

  h += '<div class="weui-cells__title">规则参数（建议别动）</div><div class="weui-cells">' +
    cell("触发线", '<input class="weui-input" id="p_q" type="number" step="1" min="2" max="30" value="' + S.P.q + '">', "% 分位") +
    selCell("大盘门控", "p_gate", [[1, "开（只在大盘跌时出手）"], [0, "关"]], S.P.useGate ? 1 : 0) + '</div>' +
    '<div class="weui-cells__tips">检验对应的是 10% + 门控开。改了就换成了一条没检验过的规则，前向记分也会按新参数重算。</div>';

  h += '<div class="weui-cells__title">数据</div><div class="weui-cells">' +
    '<div class="weui-cell"><div class="weui-cell__bd">来源</div><div class="weui-cell__ft">东方财富公开接口</div></div>' +
    '<div class="weui-cell"><div class="weui-cell__bd">当前</div><div class="weui-cell__ft">' +
    (LIVE === -1 ? "内置快照" : (LIVE === 1 ? "实时" : "加载中")) + (lastTime ? " · " + esc(lastTime) : "") + '</div></div></div>' +
    '<div class="weui-cells__tips">日线存在这台手机里，一天最多下载一次；标的和参数也只存在这台手机的浏览器里，不上传。</div>' +
    '<div class="cellbtns"><button class="btn danger" id="btnClear">清空本地设置</button></div>';
  $("p-set").innerHTML = h;

  $("ilist2").innerHTML = S.inst.map(function (it, i) {
    var D = DATA[it.code];
    return '<div class="weui-cell"><div class="weui-cell__bd">' + esc(D ? D.name : it.code) +
      ' <span class="m" style="font-size:12px">' + esc(it.code) + ' · ' + (it.kind === "etf" ? "ETF" : "股票") + '</span></div>' +
      '<div class="weui-cell__ft"><button class="btn g sm" data-del="' + i + '">移除</button></div></div>';
  }).join("") || '<div class="weui-cell"><div class="weui-cell__bd m">还没有标的</div></div>';

  var crow = [[0.5, "etf"], [1, "etf"], [2, "etf"], [5, "etf"], [20, "stock"], [100, "stock"], [300, "stock"]]
    .map(function (x) {
      var c = SW.costOf(x[0], x[1], S.F);
      return '<tr><td>' + x[0] + ' 元 · ' + (x[1] === "etf" ? "ETF" : "股票") + '</td>' +
        '<td class="r">' + fx(c.tickBp, 1) + '</td><td class="r">' + fx(c.commBp, 1) + '</td>' +
        '<td class="r">' + fx(c.stampBp, 1) + '</td>' +
        '<td class="r ' + (c.total > 12 ? "wr" : (c.total < 7 ? "ac" : "")) + '"><b>' + fx(c.total, 1) + '</b></td></tr>';
    }).join("");
  $("costDemo").innerHTML = '<div class="tw"><table><thead><tr><th>价格 / 类型</th><th class="r">一跳</th><th class="r">佣金</th>' +
    '<th class="r">印花</th><th class="r">合计 bp</th></tr></thead><tbody>' + crow + '</tbody></table></div>' +
    '<div class="sub">规则每笔的边际约 25~40bp。来回成本超过 10bp 的品种（比如 1 元以下的 ETF），剩下的就不多了。</div>';

  Array.prototype.forEach.call($("ilist2").querySelectorAll("[data-del]"), function (b) {
    b.onclick = function () { var c = S.inst[+this.dataset.del]; S.inst.splice(+this.dataset.del, 1);
      if (c) delete DATA[c.code]; save(); render(); };
  });
  $("btnAdd").onclick = function () {
    var c = String($("f_code").value).replace(/\D/g, "");
    if (c.length < 6) { toast("请输入 6 位代码"); return; }
    if (S.inst.some(function (x) { return x.code === c; })) { toast("已经有了"); return; }
    S.inst.push({ code: c, kind: $("f_kind").value });
    save(); toast("已添加，正在加载"); render(); refresh();
  };
  [["s_notional", "notional"], ["s_commRate", "commRate"], ["s_commMin", "commMin"], ["s_slip", "slipTicks"]]
    .forEach(function (p) { $(p[0]).onchange = function () { S.F[p[1]] = num(this.value); save(); render(); }; });
  $("p_q").onchange = function () { S.P.q = Math.max(2, Math.min(30, num(this.value) || 10)); save(); recompute(); render(); };
  $("p_gate").onchange = function () { S.P.useGate = +this.value; save(); recompute(); render(); };
  $("p_alarm").onchange = function () { S.P.alarm = this.checked ? 1 : 0; save(); toast(S.P.alarm ? "提醒已打开" : "提醒已关闭"); };
  $("p_theme").onchange = function () { S.P.theme = this.value; save(); applyTheme(); };
  var bn = $("btnNotif"); if (bn) bn.onclick = notifAsk;
  var bt = $("btnNotifTest"); if (bt) bt.onclick = function () {
    var hn = heroNext(todo());
    toast(notifSend("测试 · " + hn.t, hn.note) ? "已发送，看通知栏" : "发送失败，检查系统通知设置");
  };
  $("btnIcs").onclick = icsDownload;
  $("btnClear").onclick = function () {
    if (!confirm("清空本地保存的标的和参数？")) return;
    try { localStorage.removeItem(KEY); } catch (e) { }
    location.reload();
  };
}

/* ===== 事件 ===== */
Array.prototype.forEach.call($("nav").querySelectorAll("button"), function (b) {
  b.onclick = function () { go(this.dataset.p); };
});
$("btnRefresh").onclick = function () { refresh(); };
document.addEventListener("click", function (e) {
  var n = e.target;
  while (n && n !== document && !(n.dataset && n.dataset.go)) n = n.parentNode;
  if (n && n.dataset && n.dataset.go) go("detail", n.dataset.go);
});
setInterval(function () {
  $("mkt").textContent = mktLabel();
  $("mkt").className = "pill " + (mktOpen() ? "good" : "dim");
  if (PAGE === "dash") { var e = $("cd"); if (e) e.textContent = heroNext(todo()).t; }
}, 20000);

/* 自动取数：点开就是最新的。回到前台 / 获得焦点 / 盘中每分钟（节流 45 秒） */
function maybeRefresh(minAge) {
  if (busy || document.hidden) return;
  if (Date.now() - lastFetchAt < (minAge == null ? 45000 : minAge)) return;
  refresh();
}
document.addEventListener("visibilitychange", function () { if (!document.hidden) maybeRefresh(); });
window.addEventListener("focus", function () { maybeRefresh(); });
window.addEventListener("pageshow", function () { maybeRefresh(); });
/* 15:02~15:08 再自动刷几次：拿到收盘后的最终报价，15:05 起把今天这根写回手机 */
setInterval(function () { var m = bjMin(); if (mktOpen() || (isWk() && ((m >= 555 && m < 570) || (m >= 902 && m <= 908)))) maybeRefresh(60000); }, 30000);

render();
refresh();

</script>
